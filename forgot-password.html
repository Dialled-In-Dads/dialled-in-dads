<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forgot Password — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D1117; --surface: #131B2E; --border: #1E2A3E;
      --orange: #C1581A; --green: #2ECC8A;
      --text: #F0F4F8; --muted: #8892A4; --subtle: #4A5568;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 400px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-mark {
      width: 56px; height: 56px; background: var(--orange);
      border-radius: 14px; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 16px;
      font-family: 'Anton', sans-serif; font-size: 24px; color: #fff; letter-spacing: 1px;
    }
    .brand h1 { font-family: 'Anton', sans-serif; font-size: 28px; letter-spacing: 1.5px; text-transform: uppercase; }
    .brand p { margin-top: 8px; font-size: 14px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .card-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 7px; }
    input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 13px 15px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--text); outline: none; transition: border-color 0.15s; -webkit-appearance: none;
    }
    input:focus { border-color: var(--orange); }
    input::placeholder { color: var(--subtle); }
    .error-msg {
      display: none; background: rgba(193,88,26,0.12); border: 1px solid rgba(193,88,26,0.3);
      border-radius: 8px; padding: 11px 14px; font-size: 13px; color: #E8834A; margin-bottom: 16px;
    }
    .success-msg {
      display: none; background: rgba(46,204,138,0.1); border: 1px solid rgba(46,204,138,0.25);
      border-radius: 8px; padding: 11px 14px; font-size: 13px; color: var(--green); margin-bottom: 16px; line-height: 1.5;
    }
    .btn-primary {
      width: 100%; background: var(--orange); color: #fff; border: none;
      border-radius: 10px; padding: 14px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s, opacity 0.15s; margin-top: 8px;
    }
    .btn-primary:hover { background: #D4651F; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--subtle); }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--orange); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">DID</div>
      <h1>Dialed In Dads</h1>
      <p>Win the workout, win the day.</p>
    </div>

    <div class="card">
      <div class="card-title">Forgot Password</div>
      <div class="card-sub">Enter your email and we'll send you a reset link.</div>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <form id="reset-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Send Reset Link</button>
      </form>
    </div>

    <div class="footer">
      <a href="index.html">← Back to Sign In</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn   = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const errEl = document.getElementById('error-msg');
      const sucEl = document.getElementById('success-msg');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending…';

      // Determine redirect URL based on environment
      const base = window.location.origin + window.location.pathname.replace('forgot-password.html', '');
      const redirectTo = base + 'reset-password.html';

      const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });

      if (error) {
        errEl.textContent = error.message || 'Something went wrong. Try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      } else {
        sucEl.textContent = 'Check your email — we\'ve sent a reset link. It may take a minute to arrive.';
        sucEl.style.display = 'block';
        btn.textContent = 'Email Sent ✓';
        // Hide the form
        document.getElementById('reset-form').style.display = 'none';
        sucEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
