<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1117;
      --surface: #131B2E;
      --border:  #1E2A3E;
      --orange:  #C1581A;
      --green:   #2ECC8A;
      --blue:    #5B9BD5;
      --amber:   #F59E0B;
      --text:    #F0F4F8;
      --muted:   #8892A4;
      --subtle:  #4A5568;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---- Top Nav ---- */
    .top-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      color: var(--orange);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }

    .btn-back {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-back:hover { border-color: var(--orange); color: var(--orange); }

    .btn-signout {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-signout:hover { border-color: var(--orange); color: var(--orange); }

    /* ---- Page ---- */
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ---- Client header ---- */
    .client-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .client-avatar-lg {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(193,88,26,0.12);
      border: 2px solid rgba(193,88,26,0.3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      color: var(--orange);
      flex-shrink: 0;
    }

    .client-header-info { flex: 1; }

    .client-header-name {
      font-family: 'Anton', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .client-header-meta {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .phase-pill {
      display: inline-block;
      background: rgba(193,88,26,0.15);
      border: 1px solid rgba(193,88,26,0.3);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--orange);
      margin-left: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-action:hover { border-color: var(--orange); color: var(--orange); }

    .btn-action.primary {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    .btn-action.primary:hover { background: #D4651F; }

    /* ---- Stats Row ---- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Anton', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      line-height: 1;
    }

    .stat-value.orange { color: var(--orange); }
    .stat-value.green  { color: var(--green); }
    .stat-value.blue   { color: var(--blue); }
    .stat-value.amber  { color: var(--amber); }

    .stat-sub {
      font-size: 11px;
      color: var(--subtle);
      margin-top: 5px;
    }

    /* ---- 2-col layout ---- */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    /* ---- Card ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .card-body { padding: 20px; }

    /* ---- Weight Chart ---- */
    .chart-wrap {
      min-height: 130px;
      position: relative;
    }

    svg.chart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ---- Check-In History ---- */
    .checkin-row {
      display: grid;
      grid-template-columns: 90px 70px 80px 70px 70px 80px 1fr;
      gap: 0;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      align-items: center;
    }

    .checkin-row:last-child { border-bottom: none; }

    .checkin-row.header {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .feeling-mini {
      display: flex;
      gap: 2px;
    }

    .pip-mini {
      width: 10px; height: 4px;
      border-radius: 2px;
      background: var(--border);
    }

    .pip-mini.filled { background: var(--orange); }

    /* ---- Goals Panel ---- */
    .goals-form { display: flex; flex-direction: column; gap: 14px; }

    .goal-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .goal-label {
      flex: 1;
      font-size: 13px;
      color: var(--muted);
    }

    .goal-input {
      width: 90px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      text-align: right;
      transition: border-color 0.15s;
    }

    .goal-input:focus { border-color: var(--orange); }

    .goal-unit {
      font-size: 12px;
      color: var(--subtle);
      width: 30px;
    }

    /* ---- Programme Panel ---- */
    .prog-item {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.12s;
    }

    .prog-item:last-child { border-bottom: none; }
    .prog-item:hover { background: rgba(255,255,255,0.03); }
    .prog-item.active-prog { background: rgba(193,88,26,0.07); }

    .prog-name { font-size: 14px; font-weight: 500; }
    .prog-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .prog-badge {
      font-size: 11px;
      background: rgba(193,88,26,0.15);
      border: 1px solid rgba(193,88,26,0.3);
      color: var(--orange);
      border-radius: 12px;
      padding: 2px 10px;
    }

    /* ---- Phase editor ---- */
    .phase-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    .phase-select:focus { border-color: var(--orange); }

    /* ---- Buttons ---- */
    .btn-save {
      width: 100%;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #D4651F; }
    .btn-save.saved { background: var(--green); }

    .btn-assign {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-assign:hover { border-color: var(--orange); color: var(--orange); }
    .btn-assign.active { border-color: var(--green); color: var(--green); }

    .loading-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
    .empty-state { text-align: center; padding: 30px; color: var(--subtle); font-size: 13px; }

    .no-data { padding: 20px; text-align: center; color: var(--subtle); font-size: 13px; }

    /* ---- Workout History ---- */
    .session-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    }
    .session-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; cursor: pointer;
      transition: background 0.15s;
    }
    .session-header:hover { background: rgba(255,255,255,0.03); }
    .session-date { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .session-label { font-size: 14px; font-weight: 600; }
    .session-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .session-chevron { color: var(--subtle); font-size: 14px; transition: transform 0.2s; }
    .session-chevron.open { transform: rotate(90deg); }
    .session-body { padding: 0 16px 14px; display: none; }
    .session-body.open { display: block; }

    .ex-block { margin-bottom: 14px; }
    .ex-name { font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--orange); margin-bottom: 6px; }
    .sets-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sets-table th { color: var(--muted); font-weight: 500; text-align: left;
      padding: 3px 6px 6px 0; border-bottom: 1px solid var(--border); }
    .sets-table td { padding: 5px 6px 5px 0; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.04); }
    .sets-table tr:last-child td { border-bottom: none; }
    .e1rm-cell { color: var(--muted); }
    .pb-badge {
      display: inline-block; background: rgba(193,88,26,0.15);
      border: 1px solid rgba(193,88,26,0.3); border-radius: 4px;
      font-size: 9px; font-weight: 700; color: var(--orange);
      padding: 1px 4px; margin-left: 4px; vertical-align: middle;
    }

    /* Progression chart per exercise */
    .prog-section { margin-top: 16px; }
    .prog-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); margin-bottom: 10px; }
    .prog-exercise { margin-bottom: 14px; }
    .prog-ex-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .prog-chart-wrap { height: 60px; }

    /* ---- Photos section ---- */
    .photos-section {
      margin-top: 0;
      padding: 0 32px 40px;
    }

    .photos-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .photos-title {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .btn-upload-photo {
      background: var(--orange); border: none; border-radius: 8px;
      padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
      color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .btn-upload-photo:hover { background: #D4651F; }

    .photo-grid-coach {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .coach-photo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
      position: relative;
    }
    .coach-photo-card:hover { border-color: var(--subtle); }

    .coach-photo-card .new-badge {
      position: absolute; top: 6px; right: 6px;
      background: var(--orange); color: #fff;
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; border-radius: 4px; padding: 2px 5px;
    }

    .coach-photo-thumb {
      width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;
    }

    .coach-photo-meta { padding: 6px 8px; }
    .coach-photo-pose { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--orange); }
    .coach-photo-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .coach-photo-weight { font-size: 11px; font-weight: 600; color: var(--text); }

    /* Photo date groups */
    .photo-group { margin-bottom: 16px; }
    .photo-group-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .photo-group-date {
      font-family: 'Anton', sans-serif; font-size: 13px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .photo-group-weight {
      background: rgba(193,88,26,0.12); border: 1px solid rgba(193,88,26,0.25);
      border-radius: 20px; padding: 2px 10px;
      font-size: 11px; font-weight: 600; color: var(--orange);
    }
    .photo-group-count { font-size: 11px; color: var(--subtle); margin-left: auto; }
    .photo-group-row { display: flex; gap: 8px; }

    /* Coach lightbox */
    .coach-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      padding: 24px;
    }
    .coach-lightbox.open { opacity: 1; pointer-events: all; }
    .coach-lightbox-inner { max-width: 800px; width: 100%; display: flex; gap: 24px; align-items: flex-start; }
    .coach-lightbox img { max-height: 80vh; max-width: 60%; object-fit: contain; border-radius: 10px; flex-shrink: 0; }
    .coach-lightbox-info { flex: 1; }
    .coach-lightbox-pose { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--orange); margin-bottom: 4px; }
    .coach-lightbox-date { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .coach-lightbox-weight { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .coach-lightbox-notes { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .coach-lightbox-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
      width: 36px; height: 36px; color: var(--text); font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Upload modal */
    .coach-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 400; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .coach-modal-overlay.open { opacity: 1; pointer-events: all; }
    .coach-modal-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px; width: 420px; max-width: 95vw;
    }
    .coach-modal-title { font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.5px; margin-bottom: 20px; }
    .coach-form-group { margin-bottom: 14px; }
    .coach-form-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 5px; }
    .coach-form-input, .coach-form-select, .coach-form-textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; appearance: none;
    }
    .coach-form-input:focus, .coach-form-select:focus, .coach-form-textarea:focus { outline: none; border-color: var(--orange); }
    .coach-form-textarea { resize: none; min-height: 60px; }
    .coach-modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .coach-btn-cancel { flex: 1; padding: 11px; background: none; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .coach-btn-confirm { flex: 2; padding: 11px; background: var(--orange); border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; transition: background 0.15s; }
    .coach-btn-confirm:hover:not(:disabled) { background: #D4651F; }
    .coach-btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-brand">DIALED IN DADS</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="programme.html" class="nav-link">Programme</a>
    </div>
    <a href="index.html" class="btn-back">← Back</a>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </nav>

  <!-- Page -->
  <div class="page" id="page">
    <div class="loading-state">Loading client…</div>
  </div>

  <!-- Coach Lightbox -->
  <div class="coach-lightbox" id="coach-lightbox" onclick="closeCoachLightbox()">
    <button class="coach-lightbox-close" onclick="closeCoachLightbox()">×</button>
    <div class="coach-lightbox-inner" onclick="event.stopPropagation()">
      <img id="cl-img" src="" alt="">
      <div class="coach-lightbox-info">
        <div class="coach-lightbox-pose" id="cl-pose"></div>
        <div class="coach-lightbox-date" id="cl-date"></div>
        <div class="coach-lightbox-weight" id="cl-weight"></div>
        <div class="coach-lightbox-notes" id="cl-notes"></div>
      </div>
    </div>
  </div>

  <!-- Restart Phase Modal -->
  <div class="coach-modal-overlay" id="restart-modal" onclick="if(event.target===this)closeRestartModal()">
    <div class="coach-modal-box">
      <div class="coach-modal-title">Restart <span id="restart-phase-name"></span></div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">This will close the current phase and start a fresh one from today. The programme resets to Day 1.</p>
      <div class="coach-form-group">
        <label class="coach-form-label">Reason <span style="color:var(--subtle);font-size:10px;text-transform:none">optional</span></label>
        <textarea class="coach-form-textarea" id="restart-reason" placeholder="e.g. life got in the way, starting fresh…"></textarea>
      </div>
      <div class="coach-modal-actions">
        <button class="coach-btn-cancel" onclick="closeRestartModal()">Cancel</button>
        <button class="coach-btn-confirm" id="btn-confirm-restart" onclick="confirmRestart()">Restart from Today</button>
      </div>
    </div>
  </div>

  <!-- Coach Upload Modal -->
  <div class="coach-modal-overlay" id="coach-upload-modal" onclick="if(event.target===this)closeCoachUpload()">
    <div class="coach-modal-box">
      <div class="coach-modal-title">Upload Photo</div>

      <div class="coach-form-group">
        <label class="coach-form-label">Photo *</label>
        <label style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--muted);position:relative">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span id="coach-file-label-text">Click to choose photo</span>
          <input type="file" id="coach-file-input" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%" onchange="handleCoachFileSelect(this)">
        </label>
      </div>

      <div class="coach-form-group">
        <label class="coach-form-label">Pose</label>
        <select class="coach-form-select" id="coach-pose-select">
          <option value="front">Front</option>
          <option value="side">Side</option>
          <option value="back">Back</option>
        </select>
      </div>

      <div class="coach-form-group">
        <label class="coach-form-label">Date</label>
        <input type="date" class="coach-form-input" id="coach-photo-date">
      </div>

      <div class="coach-form-group">
        <label class="coach-form-label">Weight (kg) <span style="color:var(--subtle);font-size:10px;text-transform:none">optional</span></label>
        <input type="number" class="coach-form-input" id="coach-photo-weight" placeholder="e.g. 82.5" step="0.1">
      </div>

      <div class="coach-form-group">
        <label class="coach-form-label">Notes <span style="color:var(--subtle);font-size:10px;text-transform:none">optional</span></label>
        <textarea class="coach-form-textarea" id="coach-photo-notes" placeholder="Context for this photo…"></textarea>
      </div>

      <div class="coach-modal-actions">
        <button class="coach-btn-cancel" onclick="closeCoachUpload()">Cancel</button>
        <button class="coach-btn-confirm" id="btn-coach-upload" onclick="uploadCoachPhoto()">Upload</button>
      </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    let coachData = null;
    let clientData = null;
    let checkins = [];
    let programmes = [];
    let clientPhotos = [];
    let workoutSessions = [];
    let phaseHistory = [];

    const STORAGE_URL = 'https://oboeavvjrtuzeovrjsht.supabase.co/storage/v1/object/public/progress-photos';

    const clientId = new URLSearchParams(window.location.search).get('id');

    // ---- Boot ----
    (async () => {
      if (!clientId) { window.location.href = 'index.html'; return; }

      const session = await requireCoach();
      if (!session) return;

      coachData = await getCurrentCoach(session.user.id);
      if (!coachData) return;

      // Fetch client
      const { data: client } = await db
        .from('clients')
        .select('*')
        .eq('id', clientId)
        .eq('coach_id', coachData.id)
        .maybeSingle();

      if (!client) { window.location.href = 'index.html'; return; }
      clientData = client;

      // Parallel fetches
      const [checkinsRes, progsRes, photosRes, phaseRes] = await Promise.all([
        db.from('check_ins')
          .select('*')
          .eq('client_id', clientId)
          .order('check_in_date', { ascending: false })
          .limit(30),
        db.from('programmes')
          .select('*')
          .eq('coach_id', coachData.id)
          .order('created_at', { ascending: false }),
        db.from('progress_photos')
          .select('*')
          .eq('client_id', clientId)
          .order('taken_at', { ascending: false }),
        db.from('client_phase_history')
          .select('*')
          .eq('client_id', clientId)
          .order('started_at', { ascending: false }),
      ]);

      checkins      = checkinsRes.data || [];
      programmes    = progsRes.data    || [];
      clientPhotos  = photosRes.data   || [];
      phaseHistory  = phaseRes.data    || [];

      // ---- Workout history: flat queries then join in JS ----
      const { data: rawLogs } = await db
        .from('workout_logs')
        .select('*')
        .eq('client_id', clientId)
        .order('log_date', { ascending: false })
        .limit(30);

      if (rawLogs && rawLogs.length) {
        const logIds  = rawLogs.map(l => l.id);
        const dayIds  = [...new Set(rawLogs.map(l => l.programme_day_id).filter(Boolean))];

        const [setsRes, daysRes] = await Promise.all([
          db.from('set_logs').select('*').in('workout_log_id', logIds),
          db.from('programme_days').select('id, label, day_number, week_number').in('id', dayIds),
        ]);

        const sets = setsRes.data || [];
        const days = daysRes.data || [];

        // Get exercise names
        const exIds = [...new Set(sets.map(s => s.block_exercise_id).filter(Boolean))];
        let exercises = [];
        if (exIds.length) {
          const { data: exData } = await db
            .from('block_exercises')
            .select('id, exercise_name')
            .in('id', exIds);
          exercises = exData || [];
        }

        // Build lookup maps
        const daysMap = Object.fromEntries(days.map(d => [d.id, d]));
        const exMap   = Object.fromEntries(exercises.map(e => [e.id, e]));

        // Attach sets + exercise names + day info to each log
        workoutSessions = rawLogs.map(log => ({
          ...log,
          programme_days: daysMap[log.programme_day_id] || null,
          set_logs: sets
            .filter(s => s.workout_log_id === log.id)
            .map(s => ({ ...s, block_exercises: exMap[s.block_exercise_id] || null })),
        }));
      }

      renderPage();
    })();

    // ---- Render Page ----
    function renderPage() {
      const page = document.getElementById('page');

      const initial = (clientData.name || '?').charAt(0).toUpperCase();
      const phase   = clientData.current_phase || 'No Phase';

      // Stats
      const today = new Date().toISOString().split('T')[0];
      const todayCI = checkins.find(c => c.check_in_date === today);
      const withWeight = checkins.filter(c => c.weight_kg != null);
      const currentWeight = withWeight[0]?.weight_kg ?? '—';
      const startWeight = clientData.start_weight ?? withWeight[withWeight.length - 1]?.weight_kg ?? '—';
      const goalWeight  = clientData.goal_weight ?? '—';
      const lost = (typeof startWeight === 'number' && typeof currentWeight === 'number')
        ? (startWeight - currentWeight).toFixed(1) : '—';

      // Streak
      let streak = 0;
      let checkDate = new Date();
      for (let i = 0; i < 60; i++) {
        const ds = checkDate.toISOString().split('T')[0];
        if (checkins.find(c => c.check_in_date === ds)) { streak++; checkDate = new Date(checkDate - 864e5); }
        else break;
      }

      // 7-day avg weight
      const sevenDaysAgo = new Date(Date.now() - 7 * 864e5).toISOString().split('T')[0];
      const last7 = checkins.filter(c => c.check_in_date >= sevenDaysAgo && c.weight_kg != null);
      const avg7 = last7.length
        ? (last7.reduce((s, c) => s + c.weight_kg, 0) / last7.length).toFixed(1)

      page.innerHTML = `

          </div>

          </div>

            <div class="stat-value blue">${startWeight !== '—' ? startWeight + ' kg' : '—'}</div>
            <div class="stat-sub">Goal: ${goalWeight !== '—' ? goalWeight + ' kg' : '—'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Lost</div>

            <div class="stat-sub">${lost !== '—' && goalWeight !== '—' ? (goalWeight - currentWeight).toFixed(1) + ' kg to go' : ''}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Streak</div>
            <div class="stat-value orange">${streak}</div>
            <div class="stat-sub">days</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Today's Feeling</div>
            <div class="stat-value ${todayCI ? 'orange' : 'blue'}">${todayCI?.feeling_score ? todayCI.feeling_score + '/5' : todayCI ? '—' : 'No CI'}</div>
            <div class="stat-sub">${todayCI ? 'checked in today' : 'not yet today'}</div>
          </div>
        </div>

        <!-- Main 2-col -->
        <div class="two-col">
          <!-- Left: History + Chart -->
          <div>
            <!-- Weight Chart -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Weight Trend</div>

                <div class="chart-wrap" id="chart-wrap">
                  <div class="no-data">No weight data yet</div>
                </div>
              </div>
            </div>

            <!-- Check-In History -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Check-In History</div>
                <span style="font-size:12px;color:var(--muted);">Last 30 days</span>
              </div>
              <div class="checkin-row header">
                <div>Date</div>
                <div>Weight</div>
                <div>Calories</div>
                <div>Protein</div>
                <div>Steps</div>
                <div>Feeling</div>
                <div>Notes</div>
              </div>
              <div id="checkin-history"></div>
            </div>
          </div>

          <!-- Right: Goals + Phase + Programme -->
          <div>
            <!-- Goals Editor -->
            <div class="card" style="margin-bottom:20px">
              <div class="card-header">
                <div class="card-title">Goals & Targets</div>
              </div>
              <div class="card-body">
                <div class="goals-form">
                  <div class="goal-row">
                    <div class="goal-label">Goal Weight</div>
                    <input class="goal-input" id="g-weight" type="number" step="0.1" placeholder="—" value="${clientData.goal_weight ?? ''}">
                    <span class="goal-unit">kg</span>
                  </div>
                  <div class="goal-row">
                    <div class="goal-label">Calories Target</div>
                    <input class="goal-input" id="g-cals" type="number" step="50" placeholder="—" value="${clientData.goal_calories ?? ''}">
                    <span class="goal-unit">kcal</span>
                  </div>
                  <div class="goal-row">
                    <div class="goal-label">Protein Target</div>
                    <input class="goal-input" id="g-protein" type="number" step="5" placeholder="—" value="${clientData.goal_protein ?? ''}">
                    <span class="goal-unit">g</span>
                  </div>
                  <div class="goal-row">
                    <div class="goal-label">Steps Target</div>
                    <input class="goal-input" id="g-steps" type="number" step="500" placeholder="—" value="${clientData.goal_steps ?? ''}">
                    <span class="goal-unit">steps</span>
                  </div>
                  <div class="goal-row">

                    <input class="goal-input" id="g-fat" type="number" step="5" placeholder="—" value="${clientData.goal_fat ?? ''}">
                    <span class="goal-unit">g</span>
                  </div>
                  <div class="goal-row">

                    <input class="goal-input" id="g-start" type="number" step="0.1" placeholder="—" value="${clientData.start_weight ?? ''}">

                <button class="btn-save" id="btn-save-goals" onclick="saveGoals()">Save Goals</button>
              </div>
            </div>

            <!-- Daily Note -->
            <div class="card" style="margin-bottom:20px">
              <div class="card-header">
                <div class="card-title">Daily Note</div>
              </div>
              <div class="card-body">
                <textarea id="g-daily-note" rows="3" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;resize:vertical;line-height:1.5" placeholder="Write today's motivational note for this client…">${clientData.daily_note ?? ''}</textarea>
                <div style="font-size:12px;color:var(--subtle);margin-top:6px;margin-bottom:10px">Shown at the top of the client's dashboard each day. Leave blank for an auto-generated message.</div>
                <button class="btn-save" id="btn-save-note" onclick="saveNote()">Save Note</button>

            <!-- Phase Editor -->
            <div class="card" style="margin-bottom:20px">
              <div class="card-header">
                <div class="card-title">Phase</div>
              </div>
              <div class="card-body">
                ${(() => {
                  const active = phaseHistory.find(p => !p.ended_at);
                  const past   = phaseHistory.filter(p => p.ended_at);
                  return `
                  ${active ? `
                    <div style="background:rgba(193,88,26,0.08);border:1px solid rgba(193,88,26,0.2);border-radius:10px;padding:12px 14px;margin-bottom:14px">

                      <button onclick="openRestartModal()" style="margin-top:10px;width:100%;background:none;border:1px solid rgba(193,88,26,0.3);border-radius:8px;padding:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--orange);cursor:pointer;transition:border-color 0.15s,background 0.15s" onmouseover="this.style.background='rgba(193,88,26,0.1)'" onmouseout="this.style.background='none'">↺ Restart Phase from Today</button>
                    </div>` : ''}
                  <div style="font-size:11px;color:var(--muted);margin-bottom:6px;${active ? '' : 'margin-top:0'}">${active ? 'Change Phase' : 'Set Phase'}</div>
                  <select class="phase-select" id="phase-select">
                    <option value="">— Select Phase —</option>
                    <option value="Cut" ${clientData.current_phase === 'Cut' ? 'selected' : ''}>Cut</option>
                    <option value="Bulk" ${clientData.current_phase === 'Bulk' ? 'selected' : ''}>Bulk</option>
                    <option value="Maintain" ${clientData.current_phase === 'Maintain' ? 'selected' : ''}>Maintain</option>
                    <option value="Recomp" ${clientData.current_phase === 'Recomp' ? 'selected' : ''}>Recomp</option>
                  </select>
                  <button class="btn-save" id="btn-save-phase" onclick="savePhase()">Save Phase</button>
                  ${past.length ? `
                    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
                      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Phase History</div>
                      ${past.map(p => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
                          <div>
                            <div style="font-size:13px;font-weight:500">${esc(p.phase)}</div>
                            ${p.restart_reason ? `<div style="font-size:11px;color:var(--subtle);margin-top:1px">${esc(p.restart_reason)}</div>` : ''}
                          </div>
                          <div style="text-align:right;font-size:11px;color:var(--subtle)">
                            ${formatDateShort(p.started_at)} → ${formatDateShort(p.ended_at)}

            <!-- Programme Assignment -->
            <div class="card">

                ${programmes.length === 0
                  ? '<div class="no-data">No programmes yet. <a href="programme.html" style="color:var(--orange)">Build one →</a></div>'
                  : programmes.map(p => {
                    const isActive = p.id === clientData.programme_id;
                    return `<div class="prog-item ${isActive ? 'active-prog' : ''}">
                      <div>
                        <div class="prog-name">${esc(p.name)}</div>
                        <div class="prog-meta">${p.total_weeks || '—'} weeks</div>
                      </div>
                      <button class="btn-assign ${isActive ? 'active' : ''}" onclick="assignProgramme('${p.id}', '${esc(p.name)}')">

        <!-- Progress Photos section -->

          <div class="card">

              <div class="card-title">Progress Photos</div>
              <button class="btn-upload-photo" onclick="openCoachUpload()">+ Upload</button>

      renderCheckinHistory();

    // ---- Render Check-In History ----
    function renderCheckinHistory() {
      const el = document.getElementById('checkin-history');
      if (!checkins.length) {
        el.innerHTML = '<div class="no-data">No check-ins yet.</div>';
        return;
      }

      el.innerHTML = checkins.map(ci => {
        const feeling = ci.feeling_score || 0;
        return `<div class="checkin-row">
          <div style="font-size:13px;">${formatDateShort(ci.check_in_date)}</div>
          <div>${ci.weight_kg != null ? ci.weight_kg + ' kg' : '<span style="color:var(--subtle)">—</span>'}</div>
          <div>${ci.calories_yesterday != null ? ci.calories_yesterday : '<span style="color:var(--subtle)">—</span>'}</div>
          <div>${ci.protein_yesterday_g != null ? ci.protein_yesterday_g + 'g' : '<span style="color:var(--subtle)">—</span>'}</div>
          <div>${ci.steps_yesterday != null ? (ci.steps_yesterday >= 1000 ? (ci.steps_yesterday/1000).toFixed(1) + 'k' : ci.steps_yesterday) : '<span style="color:var(--subtle)">—</span>'}</div>
          <div>
            <div class="feeling-mini">
              ${[1,2,3,4,5].map(n => `<div class="pip-mini ${n <= feeling ? 'filled' : ''}"></div>`).join('')}
            </div>
          </div>
          <div style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;">
            ${ci.client_notes ? esc(ci.client_notes) : ''}
          </div>
        </div>`;
      }).join('');
    }

    // ---- Render Weight Chart ----
    function renderWeightChart() {
      const withWeight = checkins.filter(c => c.weight_kg != null).slice(0, 30).reverse();
      if (withWeight.length < 2) return;

      const wrap       = document.getElementById('chart-wrap');
      const targetWeight = clientData.goal_weight || null;
      const weights    = withWeight.map(c => c.weight_kg);
      const maxWeight  = Math.max(...weights);
      const minWeight  = Math.min(...weights);
      const maxEntry   = withWeight.reduce((a, b) => a.weight_kg >= b.weight_kg ? a : b);
      const latest     = withWeight[withWeight.length - 1];
      const first      = withWeight[0];

      const trendPerWeek = calcTrendPerWeek(withWeight);
      const trendSign    = trendPerWeek > 0 ? '+' : '';
      const trendGood    = targetWeight
        ? (targetWeight < first.weight_kg ? trendPerWeek <= 0 : trendPerWeek >= 0)
        : trendPerWeek <= 0;
      const trendColor   = trendGood ? '#2ECC8A' : '#C1581A';
      const totalChange  = (latest.weight_kg - first.weight_kg).toFixed(1);
      const totalSign    = totalChange > 0 ? '+' : '';

      const weekAgo  = new Date(Date.now() - 7 * 864e5).toISOString().split('T')[0];
      const weekData = withWeight.filter(d => d.check_in_date >= weekAgo);
      const weekHigh = weekData.length ? Math.max(...weekData.map(d => d.weight_kg)) : null;
      const weekLow  = weekData.length ? Math.min(...weekData.map(d => d.weight_kg)) : null;

      // SVG
      const W = 320, H = 130;
      const ML = 34, MR = 10, MT = 14, MB = 6;
      const cW = W - ML - MR, cH = H - MT - MB;

      let yMin = minWeight, yMax = maxWeight;
      if (targetWeight) { yMin = Math.min(yMin, targetWeight); yMax = Math.max(yMax, targetWeight); }
      const yPad = (yMax - yMin) * 0.2 || 0.5;
      yMin -= yPad; yMax += yPad;
      const yRng = yMax - yMin;

      const toY = w => MT + cH - ((w - yMin) / yRng) * cH;
      const toX = i => ML + (withWeight.length > 1 ? (i / (withWeight.length - 1)) * cW : cW / 2);
      const pts = withWeight.map((d, i) => [toX(i), toY(d.weight_kg)]);

      let gridSvg = '';
      for (let i = 0; i <= 4; i++) {
        const w = yMin + (i / 4) * yRng;
        const y = toY(w);
        if (y < MT - 2 || y > MT + cH + 2) continue;
        gridSvg += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
        gridSvg += `<text x="${ML-4}" y="${(y+3).toFixed(1)}" font-family="DM Sans,sans-serif" font-size="8.5" fill="rgba(136,146,164,0.55)" text-anchor="end">${w.toFixed(1)}</text>`;
      }

      let goalSvg = '';
      if (targetWeight) {
        const gy = toY(targetWeight);
        goalSvg  = `<line x1="${ML}" y1="${gy.toFixed(1)}" x2="${W-MR}" y2="${gy.toFixed(1)}" stroke="rgba(46,204,138,0.5)" stroke-width="1" stroke-dasharray="4 3"/>`;
        goalSvg += `<text x="${W-MR-2}" y="${(gy-3).toFixed(1)}" font-family="DM Sans,sans-serif" font-size="8" fill="rgba(46,204,138,0.7)" text-anchor="end">Goal</text>`;
      }

      const linePath = catmullRomPath(pts);
      const fillPath = linePath + ` L ${pts[pts.length-1][0].toFixed(1)},${(MT+cH).toFixed(1)} L ${pts[0][0].toFixed(1)},${(MT+cH).toFixed(1)} Z`;
      const dotsSvg  = pts.map((p, i) => {
        const last = i === pts.length - 1;
        return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?3.5:2}" fill="${last?'#2ECC8A':'rgba(46,204,138,0.5)'}" ${last?'stroke="#0D1117" stroke-width="1.5"':''}/>`;
      }).join('');
      const lp  = pts[pts.length - 1];
      const lty = lp[1] < MT + 16 ? lp[1] + 14 : lp[1] - 8;
      const labelSvg = `<text x="${lp[0].toFixed(1)}" y="${lty.toFixed(1)}" font-family="DM Sans,sans-serif" font-size="10" font-weight="600" fill="#2ECC8A" text-anchor="middle">${latest.weight_kg}kg</text>`;

      const fmtD = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

      wrap.innerHTML = `

    // ---- Restart Phase ----
    function openRestartModal() {
      const active = phaseHistory.find(p => !p.ended_at);
      document.getElementById('restart-phase-name').textContent = active ? active.phase : clientData.current_phase || 'phase';
      document.getElementById('restart-reason').value = '';

    async function confirmRestart() {
      const btn = document.getElementById('btn-confirm-restart');
      const reason = document.getElementById('restart-reason').value.trim() || null;
      btn.disabled = true;
      btn.textContent = 'Restarting…';

      try {
        const now    = new Date();
        const today  = now.toISOString().split('T')[0];

        // Anchor start date to Monday of this week so Day 1=Mon, Day 5=Fri etc line up correctly
        const daysFromMonday = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const monday = new Date(now);
        monday.setDate(monday.getDate() - daysFromMonday);
        const weekStartDate = monday.toISOString().split('T')[0];

        const active = phaseHistory.find(p => !p.ended_at);

        if (active) {
          const { error: closeErr } = await db.from('client_phase_history')
            .update({ ended_at: today, restart_reason: reason })
            .eq('id', active.id);
          if (closeErr) throw closeErr;
          active.ended_at = today;
          active.restart_reason = reason;
        }

        const phase = active?.phase || clientData.current_phase;
        const { data: newEntry, error: insertErr } = await db.from('client_phase_history').insert({
          client_id:  clientId,
          phase:      phase,
          started_at: today,
        }).select().single();
        if (insertErr) throw insertErr;
        if (newEntry) phaseHistory.unshift(newEntry);

        const currentWeight = checkins.filter(c => c.weight_kg != null)[0]?.weight_kg ?? null;
        const updates = { programme_start_date: weekStartDate };
        if (currentWeight) updates.start_weight = currentWeight;

        const { error: updateErr } = await db.from('clients').update(updates).eq('id', clientId);
        if (updateErr) throw updateErr;

        clientData.programme_start_date = weekStartDate;
        if (currentWeight) clientData.start_weight = currentWeight;

        closeRestartModal();
        renderPage();
      } catch (err) {
        console.error('Restart failed:', err);
        btn.textContent = 'Error — try again';
        btn.disabled = false;
      }
    }

    // ---- Render Workout History ----
    function renderWorkoutHistory() {
      const wrap = document.getElementById('workout-history-wrap');
      if (!wrap) return;

      if (!workoutSessions.length) {
        wrap.innerHTML = '<div class="no-data">No workouts logged yet.</div>';
        return;
      }

      document.getElementById('workout-session-count').textContent =
        `${workoutSessions.length} session${workoutSessions.length !== 1 ? 's' : ''}`;

      // Build e1RM progression per exercise across all sessions
      const e1rmHistory = {}; // { exerciseName: [{date, e1rm}] }
      workoutSessions.forEach(session => {
        (session.set_logs || []).forEach(sl => {
          const name = sl.block_exercises?.exercise_name;
          if (!name || !sl.e1rm) return;
          if (!e1rmHistory[name]) e1rmHistory[name] = [];
          // Only keep best e1rm per exercise per session
          const existing = e1rmHistory[name].find(x => x.date === session.log_date);
          if (!existing) {
            e1rmHistory[name].push({ date: session.log_date, e1rm: sl.e1rm });
          } else if (sl.e1rm > existing.e1rm) {
            existing.e1rm = sl.e1rm;
          }
        });
      });

      // Merge all workout_logs by date into one card per day
      const byDate = {};
      workoutSessions.forEach(session => {
        const date = session.log_date;
        if (!byDate[date]) {
          byDate[date] = {
            date,
            label: session.programme_days?.label || 'Workout',
            sets: [],
          };
        }
        byDate[date].sets.push(...(session.set_logs || []));
      });

      const mergedSessions = Object.values(byDate)
        .sort((a, b) => b.date.localeCompare(a.date));

      const sessionsHtml = mergedSessions.map((session, i) => {
        const sets = session.sets;

        // Group sets by exercise
        const byExercise = {};
        sets.forEach(sl => {
          const name = sl.block_exercises?.exercise_name || 'Unknown';
          if (!byExercise[name]) byExercise[name] = [];
          byExercise[name].push(sl);
        });

        const exercisesHtml = Object.entries(byExercise).map(([name, exSets]) => {
          const sortedSets = [...exSets].sort((a,b) => a.set_number - b.set_number);
          const allE1rms   = (e1rmHistory[name] || []).map(x => x.e1rm);
          const maxE1rm    = Math.max(...allE1rms);

          const rows = sortedSets.map(sl => {
            const isPb = sl.e1rm && sl.e1rm >= maxE1rm && allE1rms.length > 1;
            return `<tr>
              <td>Set ${sl.set_number}</td>
              <td><strong>${sl.weight_kg}kg</strong></td>
              <td>${sl.reps_completed} reps</td>
              <td class="e1rm-cell">${sl.e1rm ? sl.e1rm + 'kg' : '—'}${isPb ? '<span class="pb-badge">PB</span>' : ''}</td>
            </tr>`;
          }).join('');

          return `<div class="ex-block">
            <div class="ex-name">${esc(name)}</div>
            <table class="sets-table">
              <thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>e1RM</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
        }).join('');

        const totalSets = sets.length;
        const totalVol  = sets.reduce((s, sl) => s + (sl.weight_kg * sl.reps_completed || 0), 0);

        return `<div class="session-card">
          <div class="session-header" onclick="toggleSession(${i})">
            <div>
              <div class="session-date">${formatDate(session.date)}</div>
              <div class="session-label">${esc(session.label)}</div>
              <div class="session-meta">${totalSets} sets · ${Math.round(totalVol).toLocaleString()}kg volume</div>
            </div>
            <div class="session-chevron" id="chev-${i}">›</div>
          </div>
          <div class="session-body" id="session-body-${i}">
            ${exercisesHtml || '<div style="color:var(--subtle);font-size:13px">No sets logged.</div>'}
          </div>
        </div>`;
      }).join('');

      // Progression section — exercises with 3+ data points
      const progExercises = Object.entries(e1rmHistory)
        .filter(([, data]) => data.length >= 3)
        .sort((a, b) => b[1].length - a[1].length)
        .slice(0, 5);

      let progHtml = '';
      if (progExercises.length) {
        const charts = progExercises.map(([name, data]) => {
          const sorted = [...data].sort((a,b) => a.date.localeCompare(b.date));
          const vals   = sorted.map(d => d.e1rm);
          const min    = Math.min(...vals);
          const max    = Math.max(...vals);
          const range  = max - min || 1;
          const W = 280, H = 50, P = 6;
          const pts = vals.map((v, i) => {
            const x = P + (i / (vals.length - 1)) * (W - P * 2);
            const y = H - P - ((v - min) / range) * (H - P * 2);
            return `${x},${y}`;
          });
          const trend   = vals[vals.length - 1] > vals[0] ? 'var(--green)' : vals[vals.length - 1] < vals[0] ? '#e74c3c' : 'var(--muted)';
          const lastPt  = pts[pts.length - 1].split(',');
          return `<div class="prog-exercise">
            <div class="prog-ex-name">${esc(name)} <span style="font-size:11px;color:var(--muted);font-weight:400">— best e1RM: ${Math.max(...vals)}kg</span></div>
            <div class="prog-chart-wrap">
              <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">
                <polyline points="${pts.join(' ')}" fill="none" stroke="${trend}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3" fill="${trend}"/>
              </svg>
            </div>
          </div>`;
        }).join('');

        progHtml = `<div class="prog-section">
          <div class="prog-title">Strength Progression (e1RM)</div>
          ${charts}
        </div>`;
      }

      wrap.innerHTML = progHtml + sessionsHtml;
    }

      const chev = document.getElementById(`chev-${i}`);
      body.classList.toggle('open');

    }

    // ---- Helpers ----
    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function catmullRomPath(pts) {
      if (pts.length < 2) return '';
      let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[Math.max(0,i-2)], p1 = pts[i-1], p2 = pts[i], p3 = pts[Math.min(pts.length-1,i+1)];
        const cp1x = p1[0]+(p2[0]-p0[0])/6, cp1y = p1[1]+(p2[1]-p0[1])/6;
        const cp2x = p2[0]-(p3[0]-p1[0])/6, cp2y = p2[1]-(p3[1]-p1[1])/6;
        d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      return d;
    }

    function calcTrendPerWeek(data) {
      if (data.length < 2) return 0;
      const t0  = new Date(data[0].check_in_date + 'T00:00:00').getTime();
      const xs  = data.map(d => (new Date(d.check_in_date + 'T00:00:00').getTime() - t0) / 86400000);
      const ys  = data.map(d => d.weight_kg);
      const n   = xs.length;
      const sx  = xs.reduce((a,b)=>a+b,0), sy = ys.reduce((a,b)=>a+b,0);
      const sxy = xs.reduce((a,x,i)=>a+x*ys[i],0), sx2 = xs.reduce((a,x)=>a+x*x,0);
      const den = n*sx2 - sx*sx;
      return den ? ((n*sxy - sx*sy) / den) * 7 : 0;
    }

    function formatDateShort(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function parseFloatOrNull(v) {
      const n = parseFloat(v);
      return isNaN(n) ? null : n;
    }

    function parseIntOrNull(v) {
      const n = parseInt(v, 10);
      return isNaN(n) ? null : n;
    }
