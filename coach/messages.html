<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Dialed In Dads Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1117;
      --surface: #131B2E;
      --surface2:#0F1623;
      --border:  #1E2A3E;
      --orange:  #C1581A;
      --green:   #2ECC8A;
      --blue:    #5B9BD5;
      --text:    #F0F4F8;
      --muted:   #8892A4;
      --subtle:  #4A5568;
      --nav-h:   56px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 32px;
      flex-shrink: 0;
    }

    .brand { font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 1.5px; color: var(--text); text-transform: uppercase; text-decoration: none; }
    .brand span { color: var(--orange); }

    .nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }

    .nav-link { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: color 0.15s, background 0.15s; }
    .nav-link:hover { color: var(--text); background: var(--border); }
    .nav-link.active { color: var(--orange); background: rgba(193,88,26,0.1); }

    .nav-signout { font-size: 12px; color: var(--subtle); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s; }
    .nav-signout:hover { border-color: var(--orange); color: var(--orange); }

    /* ===== LAYOUT ===== */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== CLIENT LIST ===== */
    .client-list {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .list-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .list-body { flex: 1; overflow-y: auto; }

    .client-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }

    .client-item:hover { background: var(--border); }
    .client-item.active { background: rgba(193,88,26,0.08); border-left-color: var(--orange); }

    .client-avatar {
      width: 38px; height: 38px;
      background: var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 15px; color: var(--muted);
      flex-shrink: 0;
      position: relative;
    }

    .client-avatar.has-unread { background: rgba(193,88,26,0.15); color: var(--orange); }

    .unread-badge {
      position: absolute; top: -2px; right: -2px;
      width: 10px; height: 10px;
      background: var(--orange); border-radius: 50%;
      border: 2px solid var(--bg);
    }

    .client-info { flex: 1; min-width: 0; }

    .client-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }

    .client-preview {
      font-size: 11px; color: var(--subtle);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .client-time { font-size: 10px; color: var(--subtle); white-space: nowrap; }

    /* ===== THREAD ===== */
    .thread-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .thread-header {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thread-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(193,88,26,0.15); border: 1px solid rgba(193,88,26,0.3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 14px; color: var(--orange);
    }

    .thread-name { font-weight: 600; font-size: 15px; }
    .thread-sub  { font-size: 12px; color: var(--muted); }

    .thread-empty-panel {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--subtle); font-size: 14px; text-align: center; line-height: 1.6;
    }

    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---- Bubbles ---- */
    .bubble-row { display: flex; flex-direction: column; }
    .bubble-row.coach  { align-items: flex-end; }
    .bubble-row.client { align-items: flex-start; }

    .bubble {
      max-width: 60%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .bubble.coach {
      background: rgba(193,88,26,0.15);
      border: 1px solid rgba(193,88,26,0.25);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .bubble.client {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .bubble-sender { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; padding: 0 4px; }
    .bubble-time   { font-size: 10px; color: var(--subtle); margin-top: 4px; padding: 0 4px; }

    /* ---- Date divider ---- */
    .date-divider { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .date-divider span { font-size: 11px; color: var(--subtle); white-space: nowrap; }

    /* ---- Input bar ---- */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px;
      flex-shrink: 0;
    }

    .msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }

    .msg-input:focus { border-color: var(--orange); }
    .msg-input::placeholder { color: var(--subtle); }

    .btn-send {
      width: 40px; height: 40px;
      background: var(--orange); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
    }

    .btn-send:hover { background: #D4651F; }
    .btn-send svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== SCROLLBARS ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .loading-state { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <a href="index.html" class="brand">Dialed In <span>Dads</span></a>
    <div class="nav-links">
      <a href="index.html"     class="nav-link">Clients</a>
      <a href="programme.html" class="nav-link">Programmes</a>
      <a href="messages.html"  class="nav-link active">Messages</a>
      <a href="goals.html"     class="nav-link">Goals</a>
    </div>
    <button class="nav-signout" onclick="signOut()">Sign Out</button>
  </nav>

  <!-- Layout -->
  <div class="layout">

    <!-- Client list -->
    <div class="client-list">
      <div class="list-header">
        <div class="list-label">Conversations</div>
      </div>
      <div class="list-body" id="client-list">
        <div class="loading-state">Loading...</div>
      </div>
    </div>

    <!-- Thread panel -->
    <div class="thread-panel" id="thread-panel">
      <div class="thread-empty-panel">
        <div>
          <div style="font-size:40px;margin-bottom:12px">💬</div>
          <div>Select a client to view their messages</div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    let coachData    = null;
    let clients      = [];
    let selClient    = null;
    let messages     = [];
    let pollInterval = null;

    // ===== BOOT =====
    (async () => {
      const session = await requireCoach();
      if (!session) return;

      coachData = await getCurrentCoach(session.user.id);
      if (!coachData) return;

      await loadClients();

      // Check for ?client= param
      const params = new URLSearchParams(window.location.search);
      const cId    = params.get('client');
      if (cId) {
        const c = clients.find(x => x.id === cId);
        if (c) selectClient(c);
      }
    })();

    // ===== LOAD CLIENTS =====
    async function loadClients() {
      const { data } = await db
        .from('clients')
        .select('id, name, email')
        .eq('coach_id', coachData.id)
        .eq('status', 'active')
        .order('name');

      clients = data || [];

      // Get latest message + unread count per client
      const clientIds = clients.map(c => c.id);
      if (!clientIds.length) {
        document.getElementById('client-list').innerHTML =
          '<div class="loading-state">No active clients yet.</div>';
        return;
      }

      const { data: msgs } = await db
        .from('messages')
        .select('client_id, body, sent_at, is_read, sender_role')
        .in('client_id', clientIds)
        .order('sent_at', { ascending: false });

      // Build map: client_id → { latest, unread }
      const msgMap = {};
      (msgs || []).forEach(m => {
        if (!msgMap[m.client_id]) {
          msgMap[m.client_id] = { latest: m, unread: 0 };
        }
        if (!m.is_read && m.sender_role === 'client') {
          msgMap[m.client_id].unread++;
        }
      });

      renderClientList(msgMap);
    }

    function renderClientList(msgMap) {
      const el = document.getElementById('client-list');
      if (!clients.length) {
        el.innerHTML = '<div class="loading-state">No clients yet.</div>';
        return;
      }

      // Sort: unread first, then by latest message
      const sorted = [...clients].sort((a, b) => {
        const ua = (msgMap[a.id]?.unread || 0) > 0 ? 1 : 0;
        const ub = (msgMap[b.id]?.unread || 0) > 0 ? 1 : 0;
        if (ub !== ua) return ub - ua;
        const ta = msgMap[a.id]?.latest?.sent_at || '';
        const tb = msgMap[b.id]?.latest?.sent_at || '';
        return tb.localeCompare(ta);
      });

      el.innerHTML = sorted.map(c => {
        const info    = msgMap[c.id];
        const unread  = info?.unread || 0;
        const latest  = info?.latest;
        const initial = (c.name || c.email || '?').charAt(0).toUpperCase();
        const isActive = selClient?.id === c.id;

        return `<div class="client-item ${isActive ? 'active' : ''}" onclick="selectClientById('${c.id}')">
          <div class="client-avatar ${unread > 0 ? 'has-unread' : ''}">
            ${initial}
            ${unread > 0 ? '<div class="unread-badge"></div>' : ''}
          </div>
          <div class="client-info">
            <div class="client-name">${esc(c.name || c.email)}</div>
            <div class="client-preview">${latest ? esc(latest.body) : 'No messages yet'}</div>
          </div>
          ${latest ? `<div class="client-time">${timeAgo(latest.sent_at)}</div>` : ''}
        </div>`;
      }).join('');
    }

    function selectClientById(id) {
      const c = clients.find(x => x.id === id);
      if (c) selectClient(c);
    }

    async function selectClient(client) {
      selClient = client;

      // Clear poll
      if (pollInterval) clearInterval(pollInterval);

      // Re-render list to show active
      await loadClients();

      // Mark client messages as read
      await db.from('messages')
        .update({ is_read: true })
        .eq('client_id', client.id)
        .eq('sender_role', 'client')
        .eq('is_read', false);

      await loadThread();

      // Poll every 10s
      pollInterval = setInterval(loadThread, 10000);
    }

    async function loadThread() {
      if (!selClient) return;

      const { data } = await db
        .from('messages')
        .select('*')
        .eq('client_id', selClient.id)
        .order('sent_at', { ascending: true });

      messages = data || [];
      renderThread();
    }

    function renderThread() {
      const initial = (selClient.name || '?').charAt(0).toUpperCase();

      let threadHtml = '';
      let lastDate   = '';

      if (!messages.length) {
        threadHtml = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:13px;text-align:center;line-height:1.6">
          No messages yet.<br>Send ${esc(selClient.name || 'this client')} a message.
        </div>`;
      } else {
        messages.forEach(msg => {
          const msgDate = msg.sent_at.split('T')[0];
          if (msgDate !== lastDate) {
            threadHtml += `<div class="date-divider"><span>${formatDate(msgDate)}</span></div>`;
            lastDate = msgDate;
          }
          const role = msg.sender_role;
          threadHtml += `<div class="bubble-row ${role}">
            <div class="bubble-sender">${role === 'coach' ? 'You' : esc(selClient.name || 'Client')}</div>
            <div class="bubble ${role}">${esc(msg.body)}</div>
            <div class="bubble-time">${formatTime(msg.sent_at)}</div>
          </div>`;
        });
      }

      document.getElementById('thread-panel').innerHTML = `
        <div class="thread-header">
          <div class="thread-avatar">${initial}</div>
          <div>
            <div class="thread-name">${esc(selClient.name || selClient.email)}</div>
            <div class="thread-sub">Active client</div>
          </div>
        </div>
        <div class="thread" id="thread">${threadHtml}</div>
        <div class="input-bar">
          <input class="msg-input" id="msg-input" placeholder="Message ${esc(selClient.name || 'client')}…" type="text" autocomplete="off">
          <button class="btn-send" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      `;

      // Scroll to bottom
      const t = document.getElementById('thread');
      if (t) t.scrollTop = t.scrollHeight;

      // Enter to send
      const input = document.getElementById('msg-input');
      if (input) {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      if (!input) return;
      const body = input.value.trim();
      if (!body || !selClient) return;

      input.value = '';

      const { data, error } = await db.from('messages').insert({
        coach_id:    coachData.id,
        client_id:   selClient.id,
        sender_role: 'coach',
        body,
        is_read:     false,
      }).select().single();

      if (error) { console.error(error); return; }

      messages.push(data);
      renderThread();
    }

    // ===== HELPERS =====
    function formatDate(dateStr) {
      const today = new Date().toISOString().split('T')[0];
      const yest  = new Date(Date.now() - 864e5).toISOString().split('T')[0];
      if (dateStr === today) return 'Today';
      if (dateStr === yest)  return 'Yesterday';
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h`;
      return `${Math.floor(hrs / 24)}d`;
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
        .replace(/\n/g,'<br>');
    }
  </script>

</body>
</html>
