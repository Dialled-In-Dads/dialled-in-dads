<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programme Builder — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1117;
      --surface: #131B2E;
      --surface2:#0F1623;
      --border:  #1E2A3E;
      --orange:  #C1581A;
      --green:   #2ECC8A;
      --blue:    #5B9BD5;
      --text:    #F0F4F8;
      --muted:   #8892A4;
      --subtle:  #4A5568;
      --nav-h:   56px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 32px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: var(--text);
      text-transform: uppercase;
      text-decoration: none;
      margin-right: 8px;
    }

    .brand span { color: var(--orange); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .nav-link:hover { color: var(--text); background: var(--border); }
    .nav-link.active { color: var(--orange); background: rgba(193,88,26,0.1); }

    .nav-signout {
      font-size: 12px;
      color: var(--subtle);
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.15s, color 0.15s;
    }

    .nav-signout:hover { border-color: var(--orange); color: var(--orange); }

    /* ===== 3-PANEL BUILDER ===== */
    .builder {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - var(--nav-h));
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .panel:last-child { border-right: none; }

    .panel-programmes { width: 240px; flex-shrink: 0; }
    .panel-structure  { width: 260px; flex-shrink: 0; }
    .panel-editor     { flex: 1; }

    .panel-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .panel-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--subtle);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
    }

    .btn-primary:hover { background: #D4651F; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost:hover { border-color: var(--orange); color: var(--orange); }

    .btn-add {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--subtle);
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: border-color 0.15s, color 0.15s;
      margin-top: 8px;
    }

    .btn-add:hover { border-color: var(--orange); color: var(--orange); }

    /* ===== PROGRAMME LIST ===== */
    .prog-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
      border: 1px solid transparent;
    }

    .prog-item:hover { background: var(--border); }

    .prog-item.active {
      background: rgba(193,88,26,0.1);
      border-color: rgba(193,88,26,0.25);
    }

    .prog-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
    }

    .prog-meta {
      font-size: 11px;
      color: var(--subtle);
    }

    /* ===== WEEK / DAY LIST ===== */
    .week-section { margin-bottom: 12px; }

    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }

    .week-header:hover { border-color: var(--subtle); }
    .week-header.open  { border-color: var(--orange); border-radius: 8px 8px 0 0; }

    .week-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .week-chevron {
      font-size: 10px;
      color: var(--subtle);
      transition: transform 0.2s;
    }

    .week-header.open .week-chevron { transform: rotate(180deg); }

    .week-days {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      display: none;
    }

    .week-days.open { display: block; }

    .day-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .day-item:last-child { border-bottom: none; }
    .day-item:hover { background: var(--border); }

    .day-item.active { background: rgba(193,88,26,0.08); }

    .day-type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .day-type-dot.workout { background: var(--green); }
    .day-type-dot.rest    { background: var(--subtle); }

    .day-name {
      font-size: 12px;
      color: var(--text);
      flex: 1;
    }

    .day-num {
      font-size: 10px;
      color: var(--subtle);
    }

    /* ===== EDITOR PANEL ===== */
    .editor-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .editor-day-title {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 2px;
    }

    .editor-day-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    /* ===== BLOCK ===== */
    .block-section { margin-bottom: 20px; }

    .block-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tier-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .tier-badge.win   { background: rgba(193,88,26,0.2);  color: var(--orange); }
    .tier-badge.bonus { background: rgba(46,204,138,0.12); color: var(--green); }
    .tier-badge.extra { background: rgba(91,155,213,0.12); color: var(--blue); }

    .block-desc {
      font-size: 11px;
      color: var(--subtle);
    }

    /* ===== EXERCISE ROWS ===== */
    .exercise-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }

    .exercise-table th {
      font-size: 10px;
      font-weight: 600;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0 8px 6px 0;
      text-align: left;
    }

    .exercise-table td {
      padding: 8px 8px 8px 0;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }

    .exercise-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .exercise-muscle {
      font-size: 11px;
      color: var(--subtle);
      margin-top: 1px;
    }

    .exercise-scheme {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .exercise-weight {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--subtle);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .btn-del:hover { color: #E87060; background: rgba(232,112,96,0.1); }

    /* ===== ASSIGN SECTION ===== */
    .assign-section {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      flex-shrink: 0;
      background: var(--surface2);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      margin: 0 16px;
    }

    .modal-title {
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: var(--text);
    }

    .modal-field { margin-bottom: 14px; }

    .modal-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .modal-input, .modal-select, .modal-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--orange); }
    .modal-select option { background: var(--surface); }
    .modal-textarea { resize: none; height: 64px; }

    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-modal-cancel {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-modal-cancel:hover { border-color: var(--subtle); }

    .btn-modal-save {
      flex: 2;
      background: var(--orange);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-modal-save:hover { background: #D4651F; }
    .btn-modal-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal-error {
      font-size: 12px;
      color: #E8834A;
      margin-top: 8px;
      display: none;
    }

    /* ===== SCROLLBARS ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ===== INLINE FORM ===== */
    .inline-form {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }

    .inline-form.open { display: block; }

    .inline-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }

    .inline-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .inline-input:focus { border-color: var(--orange); }
    .inline-input::placeholder { color: var(--subtle); }

    .inline-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .inline-select option { background: var(--surface); }

    .inline-actions { display: flex; gap: 6px; }

    .btn-inline-save {
      background: var(--orange);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    .btn-inline-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <a href="index.html" class="brand">Dialed In <span>Dads</span></a>
    <div class="nav-links">
      <a href="index.html"      class="nav-link">Clients</a>
      <a href="programme.html"  class="nav-link active">Programmes</a>
      <a href="messages.html"   class="nav-link">Messages</a>
      <a href="goals.html"      class="nav-link">Goals</a>
    </div>
    <button class="nav-signout" onclick="signOut()">Sign Out</button>
  </nav>

  <!-- 3-Panel Builder -->
  <div class="builder">

    <!-- Panel 1: Programmes -->
    <div class="panel panel-programmes">
      <div class="panel-header">
        <div class="panel-label">Programmes</div>
        <button class="btn-primary" onclick="openNewProgModal()">+ New Programme</button>
      </div>
      <div class="panel-body" id="prog-list">
        <div class="panel-empty">No programmes yet. Create your first one.</div>
      </div>
    </div>

    <!-- Panel 2: Structure (Weeks + Days) -->
    <div class="panel panel-structure">
      <div class="panel-header">
        <div class="panel-label">Structure</div>
        <button class="btn-ghost" id="add-week-btn" onclick="addWeek()" style="display:none">+ Week</button>
      </div>
      <div class="panel-body" id="structure-panel">
        <div class="panel-empty">Select a programme to view its structure.</div>
      </div>
    </div>

    <!-- Panel 3: Day Editor -->
    <div class="panel panel-editor">
      <div id="editor-content" style="display:flex;flex-direction:column;height:100%">
        <div class="panel-body" style="display:flex;align-items:center;justify-content:center">
          <div class="panel-empty">Select a day to edit its exercises.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== MODAL: New Programme ===== -->
  <div class="modal-overlay" id="prog-modal">
    <div class="modal">
      <div class="modal-title">New Programme</div>
      <div class="modal-field">
        <label class="modal-label">Programme Name</label>
        <input class="modal-input" id="prog-name" placeholder="e.g. 12-Week Strength Foundation">
      </div>
      <div class="modal-field">
        <label class="modal-label">Description</label>
        <textarea class="modal-textarea" id="prog-desc" placeholder="What is this programme for?"></textarea>
      </div>
      <div class="modal-field">
        <label class="modal-label">Total Weeks</label>
        <input class="modal-input" id="prog-weeks" type="number" min="1" max="52" value="12">
      </div>
      <div class="modal-error" id="prog-error"></div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('prog-modal')">Cancel</button>
        <button class="btn-modal-save" id="prog-save-btn" onclick="saveProgramme()">Create Programme</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Add Day ===== -->
  <div class="modal-overlay" id="day-modal">
    <div class="modal">
      <div class="modal-title">Add Day</div>
      <div class="modal-row">
        <div class="modal-field">
          <label class="modal-label">Day Number</label>
          <select class="modal-select" id="day-number">
            <option value="1">Day 1 (Mon)</option>
            <option value="2">Day 2 (Tue)</option>
            <option value="3">Day 3 (Wed)</option>
            <option value="4">Day 4 (Thu)</option>
            <option value="5">Day 5 (Fri)</option>
            <option value="6">Day 6 (Sat)</option>
            <option value="7">Day 7 (Sun)</option>
          </select>
        </div>
        <div class="modal-field">
          <label class="modal-label">Type</label>
          <select class="modal-select" id="day-type">
            <option value="workout">Workout</option>
            <option value="rest">Rest Day</option>
          </select>
        </div>
      </div>
      <div class="modal-field">
        <label class="modal-label">Label</label>
        <input class="modal-input" id="day-label" placeholder="e.g. Push, Pull, Legs, Upper…">
      </div>
      <div class="modal-error" id="day-error"></div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('day-modal')">Cancel</button>
        <button class="btn-modal-save" id="day-save-btn" onclick="saveDay()">Add Day</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Assign to Client ===== -->
  <div class="modal-overlay" id="assign-modal">
    <div class="modal">
      <div class="modal-title">Assign Programme</div>
      <div class="modal-field">
        <label class="modal-label">Client</label>
        <select class="modal-select" id="assign-client"></select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Start Date</label>
        <input class="modal-input" id="assign-date" type="date">
      </div>
      <div class="modal-error" id="assign-error"></div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('assign-modal')">Cancel</button>
        <button class="btn-modal-save" id="assign-save-btn" onclick="assignProgramme()">Assign</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>

    // ===== STATE =====
    let coachData    = null;
    let programmes   = [];
    let clients      = [];
    let selProg      = null;   // selected programme
    let weeks        = [];
    let selWeek      = null;   // selected week id (for UI open state)
    let days         = {};     // { week_id: [days] }
    let selDay       = null;   // selected day object
    let blocks       = [];     // blocks for selDay
    let exercises    = {};     // { block_id: [exercises] }

    // ===== BOOT =====
    (async () => {
      const session = await requireCoach();
      if (!session) return;

      coachData = await getCurrentCoach(session.user.id);
      if (!coachData) return;

      // Load programmes + clients in parallel
      const [{ data: progs }, { data: cls }] = await Promise.all([
        db.from('programmes').select('*').eq('coach_id', coachData.id).order('created_at'),
        db.from('clients').select('id, name').eq('coach_id', coachData.id).eq('status', 'active').order('name'),
      ]);

      programmes = progs || [];
      clients    = cls   || [];

      renderProgList();
    })();

    // ===== PROGRAMME LIST =====
    function renderProgList() {
      const el = document.getElementById('prog-list');
      if (!programmes.length) {
        el.innerHTML = '<div class="panel-empty">No programmes yet.<br>Create your first one.</div>';
        return;
      }
      el.innerHTML = programmes.map(p => `
        <div class="prog-item ${selProg?.id === p.id ? 'active' : ''}" onclick="selectProg('${p.id}')">
          <div class="prog-name">${esc(p.name)}</div>
          <div class="prog-meta">${p.total_weeks} weeks</div>
        </div>
      `).join('');
    }

    async function selectProg(id) {
      selProg  = programmes.find(p => p.id === id);
      selWeek  = null;
      selDay   = null;
      blocks   = [];
      exercises = {};
      renderProgList();
      document.getElementById('add-week-btn').style.display = 'flex';
      await loadWeeks();
      renderEditor();
    }

    // ===== WEEKS =====
    async function loadWeeks() {
      if (!selProg) return;
      const { data } = await db
        .from('programme_weeks')
        .select('*')
        .eq('programme_id', selProg.id)
        .order('week_number');
      weeks = data || [];
      days  = {};
      // Load days for all weeks
      for (const w of weeks) {
        const { data: ds } = await db
          .from('programme_days')
          .select('*')
          .eq('week_id', w.id)
          .order('day_number');
        days[w.id] = ds || [];
      }
      renderStructure();
    }

    function renderStructure() {
      const el = document.getElementById('structure-panel');
      if (!selProg) { el.innerHTML = '<div class="panel-empty">Select a programme.</div>'; return; }
      if (!weeks.length) {
        el.innerHTML = '<div class="panel-empty">No weeks yet.<br>Click "+ Week" to add one.</div>';
        return;
      }

      el.innerHTML = weeks.map(w => {
        const wDays = days[w.id] || [];
        const isOpen = selWeek === w.id;
        return `
          <div class="week-section">
            <div class="week-header ${isOpen ? 'open' : ''}" onclick="toggleWeek('${w.id}')">
              <span class="week-label">Week ${w.week_number}</span>
              <span class="week-chevron">▼</span>
            </div>
            <div class="week-days ${isOpen ? 'open' : ''}">
              ${wDays.map(d => `
                <div class="day-item ${selDay?.id === d.id ? 'active' : ''}" onclick="selectDay('${d.id}','${w.id}')">
                  <div class="day-type-dot ${d.day_type}"></div>
                  <div class="day-name">${esc(d.label || (d.day_type === 'rest' ? 'Rest Day' : 'Workout'))}</div>
                  <div class="day-num">D${d.day_number}</div>
                </div>
              `).join('')}
              <div style="padding:6px 8px">
                <button class="btn-add" onclick="openAddDayModal('${w.id}');event.stopPropagation()">+ Add Day</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleWeek(weekId) {
      selWeek = selWeek === weekId ? null : weekId;
      renderStructure();
    }

    async function addWeek() {
      if (!selProg) return;
      const nextNum = (weeks.length || 0) + 1;
      const { data, error } = await db
        .from('programme_weeks')
        .insert({ programme_id: selProg.id, week_number: nextNum, label: `Week ${nextNum}` })
        .select().single();
      if (error) { alert(error.message); return; }
      weeks.push(data);
      days[data.id] = [];
      selWeek = data.id;
      renderStructure();
    }

    // ===== DAYS =====
    let addDayWeekId = null;

    function openAddDayModal(weekId) {
      addDayWeekId = weekId;
      document.getElementById('day-label').value   = '';
      document.getElementById('day-error').style.display = 'none';
      openModal('day-modal');
    }

    async function saveDay() {
      const btn   = document.getElementById('day-save-btn');
      const errEl = document.getElementById('day-error');
      const num   = parseInt(document.getElementById('day-number').value);
      const type  = document.getElementById('day-type').value;
      const label = document.getElementById('day-label').value.trim();

      if (!label) { showModalError('day-error', 'Please add a label (e.g. Push, Pull, Legs)'); return; }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      const { data: day, error } = await db
        .from('programme_days')
        .insert({ week_id: addDayWeekId, day_number: num, day_type: type, label })
        .select().single();

      if (error) { showModalError('day-error', error.message); btn.disabled = false; btn.textContent = 'Add Day'; return; }

      days[addDayWeekId] = [...(days[addDayWeekId] || []), day].sort((a, b) => a.day_number - b.day_number);

      // Auto-create 3 blocks for workout days
      if (type === 'workout') {
        const blockInserts = [
          { day_id: day.id, tier: 'Win',   block_type: 'straight', sort_order: 1 },
          { day_id: day.id, tier: 'Bonus', block_type: 'straight', sort_order: 2 },
          { day_id: day.id, tier: 'Extra', block_type: 'straight', sort_order: 3 },
        ];
        await db.from('workout_blocks').insert(blockInserts);
      }

      closeModal('day-modal');
      btn.disabled = false;
      btn.textContent = 'Add Day';
      renderStructure();

      // Auto-select the new day
      await selectDay(day.id, addDayWeekId);
    }

    async function selectDay(dayId, weekId) {
      // Find day in local state
      selDay = (days[weekId] || []).find(d => d.id === dayId);
      selWeek = weekId;
      blocks    = [];
      exercises = {};

      if (selDay?.day_type === 'workout') {
        const { data: bks } = await db
          .from('workout_blocks')
          .select('*')
          .eq('day_id', dayId)
          .order('sort_order');
        blocks = bks || [];

        // Load exercises for each block
        for (const b of blocks) {
          const { data: exs } = await db
            .from('block_exercises')
            .select('*')
            .eq('block_id', b.id)
            .order('sort_order');
          exercises[b.id] = exs || [];
        }
      }

      renderStructure();
      renderEditor();
    }

    // ===== EDITOR =====
    function renderEditor() {
      const el = document.getElementById('editor-content');

      if (!selDay) {
        el.innerHTML = `<div class="panel-body" style="display:flex;align-items:center;justify-content:center">
          <div class="panel-empty">Select a day to edit its exercises.</div>
        </div>`;
        return;
      }

      const weekNum = weeks.find(w => w.id === selDay.week_id)?.week_number || '?';

      if (selDay.day_type === 'rest') {
        el.innerHTML = `
          <div class="editor-header">
            <div class="editor-day-title">${esc(selDay.label || 'Rest Day')}</div>
            <div class="editor-day-meta">Week ${weekNum} · Day ${selDay.day_number} · Rest</div>
          </div>
          <div class="editor-body" style="display:flex;align-items:center;justify-content:center">
            <div class="panel-empty">Rest day — no exercises needed.<br>Recovery is part of the programme.</div>
          </div>`;
        return;
      }

      const blocksHtml = blocks.map(b => {
        const tier  = b.tier.toLowerCase();
        const exs   = exercises[b.id] || [];
        const exHtml = exs.length ? `
          <table class="exercise-table">
            <thead>
              <tr>
                <th>Exercise</th>
                <th>Sets × Reps</th>
                <th>Target</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${exs.map(ex => `
                <tr>
                  <td>
                    <div class="exercise-name">${esc(ex.exercise_name)}</div>
                    ${ex.muscle_group ? `<div class="exercise-muscle">${esc(ex.muscle_group)}</div>` : ''}
                  </td>
                  <td><span class="exercise-scheme">${esc(ex.rep_scheme || `${ex.sets}×?`)}</span></td>
                  <td><span class="exercise-weight">${ex.target_weight_kg ? ex.target_weight_kg + 'kg' : '—'}</span></td>
                  <td><button class="btn-del" onclick="deleteExercise('${ex.id}','${b.id}')">×</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<div style="font-size:12px;color:var(--subtle);margin-bottom:8px">No exercises yet.</div>';

        return `
          <div class="block-section" id="block-${b.id}">
            <div class="block-header">
              <span class="tier-badge ${tier}">${b.tier}</span>
              <span class="block-desc">${tier === 'win' ? 'Key compound lift — non-negotiable' : tier === 'bonus' ? 'Supporting compound' : 'Isolation / finishing touches'}</span>
            </div>
            ${exHtml}
            <button class="btn-add" onclick="toggleAddEx('${b.id}')">+ Add Exercise</button>
            <div class="inline-form" id="ex-form-${b.id}">
              <div class="inline-grid">
                <input class="inline-input" id="ex-name-${b.id}"    placeholder="Exercise name" >
                <select class="inline-select" id="ex-muscle-${b.id}">
                  <option value="">Muscle group</option>
                  <option>Chest</option><option>Back</option><option>Shoulders</option>
                  <option>Biceps</option><option>Triceps</option><option>Legs</option>
                  <option>Glutes</option><option>Core</option><option>Full Body</option>
                </select>
                <input class="inline-input" id="ex-scheme-${b.id}"  placeholder="e.g. 5×5">
                <input class="inline-input" id="ex-weight-${b.id}"  placeholder="kg" type="number" step="0.5" min="0">
              </div>
              <div class="inline-actions">
                <button class="btn-inline-save"   onclick="saveExercise('${b.id}')">Save</button>
                <button class="btn-inline-cancel" onclick="toggleAddEx('${b.id}')">Cancel</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      el.innerHTML = `
        <div class="editor-header">
          <div class="editor-day-title">${esc(selDay.label || 'Workout')}</div>
          <div class="editor-day-meta">Week ${weekNum} · Day ${selDay.day_number} · Workout</div>
        </div>
        <div class="editor-body">
          ${blocksHtml || '<div class="panel-empty">No blocks found for this day.</div>'}
        </div>
        <div class="assign-section">
          <button class="btn-primary" style="max-width:200px" onclick="openAssignModal()">Assign to Client →</button>
        </div>
      `;
    }

    // ===== EXERCISES =====
    function toggleAddEx(blockId) {
      const f = document.getElementById(`ex-form-${blockId}`);
      f.classList.toggle('open');
      if (f.classList.contains('open')) {
        document.getElementById(`ex-name-${blockId}`).focus();
      }
    }

    async function saveExercise(blockId) {
      const name   = document.getElementById(`ex-name-${blockId}`).value.trim();
      const muscle = document.getElementById(`ex-muscle-${blockId}`).value;
      const scheme = document.getElementById(`ex-scheme-${blockId}`).value.trim();
      const weight = parseFloat(document.getElementById(`ex-weight-${blockId}`).value) || null;

      if (!name) { alert('Exercise name is required'); return; }

      // Parse sets from scheme (e.g. "5×5" → 5, "3x12" → 3)
      const setsMatch = scheme.match(/^(\d+)[x×]/i);
      const sets = setsMatch ? parseInt(setsMatch[1]) : null;

      const nextOrder = (exercises[blockId]?.length || 0) + 1;

      const { data, error } = await db
        .from('block_exercises')
        .insert({
          block_id:        blockId,
          exercise_name:   name,
          muscle_group:    muscle || null,
          sets:            sets,
          rep_scheme:      scheme || null,
          target_weight_kg: weight,
          sort_order:      nextOrder,
        })
        .select().single();

      if (error) { alert(error.message); return; }

      if (!exercises[blockId]) exercises[blockId] = [];
      exercises[blockId].push(data);
      renderEditor();
    }

    async function deleteExercise(exId, blockId) {
      if (!confirm('Remove this exercise?')) return;
      const { error } = await db.from('block_exercises').delete().eq('id', exId);
      if (error) { alert(error.message); return; }
      exercises[blockId] = exercises[blockId].filter(e => e.id !== exId);
      renderEditor();
    }

    // ===== ASSIGN TO CLIENT =====
    function openAssignModal() {
      if (!selProg) return;
      const select = document.getElementById('assign-client');
      select.innerHTML = clients.length
        ? clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
        : '<option value="">No active clients</option>';
      document.getElementById('assign-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('assign-error').style.display = 'none';
      openModal('assign-modal');
    }

    async function assignProgramme() {
      const clientId  = document.getElementById('assign-client').value;
      const startDate = document.getElementById('assign-date').value;
      const btn       = document.getElementById('assign-save-btn');

      if (!clientId)  { showModalError('assign-error', 'Please select a client.'); return; }
      if (!startDate) { showModalError('assign-error', 'Please set a start date.'); return; }

      btn.disabled = true; btn.textContent = 'Assigning…';

      // Deactivate any existing active assignment for this client
      await db.from('programme_assignments')
        .update({ is_active: false })
        .eq('client_id', clientId)
        .eq('is_active', true);

      const { error } = await db.from('programme_assignments').insert({
        client_id:    clientId,
        programme_id: selProg.id,
        start_date:   startDate,
        is_active:    true,
      });

      if (error) { showModalError('assign-error', error.message); btn.disabled = false; btn.textContent = 'Assign'; return; }

      closeModal('assign-modal');
      btn.disabled = false; btn.textContent = 'Assign';

      // Show confirmation
      const clientName = clients.find(c => c.id === clientId)?.name || 'Client';
      alert(`✓ "${selProg.name}" assigned to ${clientName} starting ${startDate}`);
    }

    // ===== NEW PROGRAMME =====
    function openNewProgModal() {
      document.getElementById('prog-name').value  = '';
      document.getElementById('prog-desc').value  = '';
      document.getElementById('prog-weeks').value = '12';
      document.getElementById('prog-error').style.display = 'none';
      openModal('prog-modal');
    }

    async function saveProgramme() {
      const btn  = document.getElementById('prog-save-btn');
      const name = document.getElementById('prog-name').value.trim();
      const desc = document.getElementById('prog-desc').value.trim();
      const wks  = parseInt(document.getElementById('prog-weeks').value) || 12;

      if (!name) { showModalError('prog-error', 'Programme name is required.'); return; }

      btn.disabled = true; btn.textContent = 'Creating…';

      const { data, error } = await db.from('programmes').insert({
        coach_id:    coachData.id,
        name,
        description: desc || null,
        total_weeks: wks,
      }).select().single();

      if (error) { showModalError('prog-error', error.message); btn.disabled = false; btn.textContent = 'Create Programme'; return; }

      programmes.push(data);
      closeModal('prog-modal');
      btn.disabled = false; btn.textContent = 'Create Programme';
      renderProgList();
      await selectProg(data.id);
    }

    // ===== MODAL HELPERS =====
    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function showModalError(elId, msg) {
      const el = document.getElementById(elId);
      el.textContent = msg;
      el.style.display = 'block';
    }

    // ===== UTILS =====
    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
