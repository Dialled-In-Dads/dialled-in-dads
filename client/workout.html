<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dialed In Dads">
  <link rel="manifest" href="../manifest.json">
  <title>Workout — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1117;
      --surface: #131B2E;
      --border:  #1E2A3E;
      --orange:  #C1581A;
      --green:   #2ECC8A;
      --blue:    #5B9BD5;
      --text:    #F0F4F8;
      --muted:   #8892A4;
      --subtle:  #4A5568;
      --nav-h:   64px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 24px);
    }

    /* ---- Header ---- */
    .page-header {
      padding: 24px 20px 0;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .page-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .page-title { font-family: 'Anton', sans-serif; font-size: 30px; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1; }
    .page-date  { font-size: 13px; color: var(--muted); margin-top: 5px; }

    .signout-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-family: 'DM Sans', sans-serif; font-size: 11px;
      color: var(--subtle); cursor: pointer; margin-top: 4px;
      transition: border-color 0.15s, color 0.15s;
    }
    .signout-btn:hover { border-color: var(--subtle); color: var(--muted); }

    /* ---- Tabs ---- */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtle);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      color: var(--orange);
      background: rgba(193,88,26,0.1);
      border-color: rgba(193,88,26,0.2);
    }

    /* ---- Content ---- */
    .content { padding: 16px 16px 0; }

    /* ---- Loading ---- */
    .loading-state { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px; }

    /* ---- Cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
    }

    /* ---- Tier badge ---- */
    .tier-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
      padding: 3px 10px; border-radius: 20px;
    }
    .tier-badge.win   { background: rgba(193,88,26,0.2);  color: var(--orange); }
    .tier-badge.bonus { background: rgba(46,204,138,0.12); color: var(--green); }
    .tier-badge.extra { background: rgba(91,155,213,0.12); color: var(--blue); }

    /* ---- Block section ---- */
    .block-section { margin-bottom: 20px; }

    .superset-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
      color: var(--blue); background: rgba(91,155,213,0.12);
      border: 1px solid rgba(91,155,213,0.25);
      border-radius: 4px; padding: 2px 7px; text-transform: uppercase;
    }

    .ss-label {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: var(--blue); background: rgba(91,155,213,0.12);
      border-radius: 4px; padding: 1px 5px; margin-right: 4px;
    }

    .dropset-tag {
      display: inline-block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.5px; color: var(--orange);
      background: rgba(193,88,26,0.1); border: 1px solid rgba(193,88,26,0.2);
      border-radius: 4px; padding: 1px 5px; margin-left: 6px;
    }

    .block-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }

    .block-desc { font-size: 11px; color: var(--subtle); }

    /* ---- Exercise card ---- */
    .exercise-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .exercise-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;
    }

    .exercise-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .exercise-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .exercise-target {
      text-align: right;
    }
    .exercise-target .target-val { font-family: 'Anton', sans-serif; font-size: 18px; color: var(--text); }
    .exercise-target .target-label { font-size: 10px; color: var(--subtle); }

    /* ---- Set rows ---- */
    .sets-header {
      display: grid; grid-template-columns: 28px 1fr 1fr 80px; gap: 8px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
    }

    .sets-header span {
      font-size: 10px; font-weight: 600; color: var(--subtle);
      text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
    }

    .set-row {
      display: grid; grid-template-columns: 28px 1fr 1fr 80px; gap: 8px;
      align-items: center; margin-bottom: 6px;
    }

    .set-num {
      font-size: 11px; font-weight: 600; color: var(--subtle);
      text-align: center; padding-top: 10px;
    }

    .set-row.drop-row {
      background: rgba(193,88,26,0.05);
      border: 1px solid rgba(193,88,26,0.15);
      border-radius: 8px;
      padding: 4px 6px 4px 0;
      margin-top: 2px;
    }
    .set-row.drop-row .set-num {
      color: var(--orange);
      font-size: 13px;
    }

    .set-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      text-align: center;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .set-input:focus { border-color: var(--orange); }
    .set-input::placeholder { color: var(--subtle); font-size: 12px; }
    .set-input.logged { border-color: var(--green); background: rgba(46,204,138,0.05); color: var(--green); }

    .prev-val {
      font-size: 11px; color: var(--subtle); text-align: center; padding-top: 2px;
    }

    .btn-log-set {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      width: 100%;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-log-set:hover  { border-color: var(--green); color: var(--green); }
    .btn-log-set.done   { background: rgba(46,204,138,0.1); border-color: var(--green); color: var(--green); }
    .btn-log-set.done::after { content: ' ✓'; }

    /* ---- E1RM ---- */
    .e1rm-row { font-size: 11px; color: var(--subtle); text-align: center; margin-top: 4px; }
    .e1rm-row span { color: var(--green); font-weight: 600; }

    /* ---- Completion banner ---- */
    .completion-banner {
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .completion-banner.win-done {
      background: rgba(193,88,26,0.1);
      border: 1px solid rgba(193,88,26,0.25);
    }

    .completion-banner.bonus-done {
      background: rgba(46,204,138,0.08);
      border: 1px solid rgba(46,204,138,0.2);
    }

    .completion-banner.extra-done {
      background: rgba(91,155,213,0.08);
      border: 1px solid rgba(91,155,213,0.2);
    }

    .completion-text {
      font-family: 'Anton', sans-serif;
      font-size: 15px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .win-done   .completion-text { color: var(--orange); }
    .bonus-done .completion-text { color: var(--green); }
    .extra-done .completion-text { color: var(--blue); }

    /* ---- Rest day card ---- */
    .rest-card {
      text-align: center;
      padding: 32px 20px;
    }

    .rest-icon { font-size: 40px; margin-bottom: 12px; }
    .rest-title { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
    .rest-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }

    /* ---- No programme ---- */
    .no-prog { text-align: center; padding: 40px 20px; }
    .no-prog p { font-size: 14px; color: var(--muted); line-height: 1.7; }

    /* ---- This week view ---- */
    .week-day-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .week-day-item.today { border-color: var(--orange); }

    .day-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .day-dot.workout { background: var(--green); }
    .day-dot.rest    { background: var(--subtle); }
    .day-dot.today   { background: var(--orange); }

    .day-info { flex: 1; }
    .day-info strong { font-size: 14px; font-weight: 600; display: block; }
    .day-info span   { font-size: 12px; color: var(--muted); }

    .today-pill {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--orange);
      background: rgba(193,88,26,0.1); border-radius: 20px; padding: 3px 8px;
    }

    /* ---- Cardio section ---- */
    .cardio-btn {
      width: 100%;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 12px;
      transition: border-color 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .cardio-btn:hover { border-color: var(--blue); color: var(--blue); }

    .cardio-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: none;
    }

    .cardio-form.open { display: block; }

    .cardio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

    .field-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }

    .form-input, .form-select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--text); outline: none; transition: border-color 0.15s; -webkit-appearance: none;
    }

    .form-select option { background: var(--surface); }
    .form-input:focus, .form-select:focus { border-color: var(--blue); }

    .btn-save-cardio {
      background: var(--blue); border: none; border-radius: 8px; padding: 10px 20px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      color: #fff; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-save-cardio:hover { opacity: 0.85; }

    /* ---- Full plan view ---- */
    .plan-week { margin-bottom: 16px; }

    .plan-week-header {
      font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }

    .plan-day-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid rgba(30,42,62,0.5);
    }

    .plan-day-row:last-child { border-bottom: none; }

    .plan-day-num { font-size: 11px; color: var(--subtle); width: 30px; }
    .plan-day-label { font-size: 13px; color: var(--text); flex: 1; }
    .plan-day-type {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: 20px;
    }
    .plan-day-type.workout { background: rgba(46,204,138,0.1); color: var(--green); }
    .plan-day-type.rest    { background: var(--border); color: var(--subtle); }

    /* ---- Switch button ---- */
    .btn-switch {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 11px;
      font-weight: 500; color: var(--muted); cursor: pointer;
      transition: border-color 0.15s, color 0.15s; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-switch:hover { border-color: var(--orange); color: var(--orange); }
    .week-day-item.tappable { cursor: pointer; }

    /* ---- Bottom sheet ---- */
    .sheet-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 200; align-items: flex-end;
    }
    .sheet-overlay.open { display: flex; }
    .sheet {
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0; width: 100%; max-height: 82vh;
      display: flex; flex-direction: column; animation: slideUp 0.22s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-header {
      padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .sheet-title { font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
    .sheet-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 2px 8px; line-height: 1; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sheet-footer { padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .picker-week-label {
      font-size: 10px; font-weight: 600; color: var(--subtle);
      text-transform: uppercase; letter-spacing: 1px; padding: 10px 20px 4px;
    }
    .picker-day-row {
      display: flex; align-items: center; gap: 12px; padding: 13px 20px;
      cursor: pointer; transition: background 0.1s; -webkit-tap-highlight-color: transparent;
    }
    .picker-day-row:active { background: rgba(255,255,255,0.04); }
    .picker-day-row.is-active { background: rgba(193,88,26,0.08); border-left: 3px solid var(--orange); }
    .picker-day-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .picker-day-name { font-size: 14px; font-weight: 500; flex: 1; }
    .picker-day-meta { font-size: 11px; color: var(--muted); }
    .btn-free-session {
      width: 100%; background: none; border: 1px dashed var(--border);
      border-radius: 10px; padding: 13px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer;
      transition: border-color 0.15s, color 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-free-session:hover { border-color: var(--blue); color: var(--blue); }

    /* ---- Free session exercise picker ---- */
    .ex-search {
      display: block; box-sizing: border-box; width: calc(100% - 32px); margin: 12px 16px 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--text); outline: none; flex-shrink: 0;
    }
    .ex-search:focus { border-color: var(--orange); }
    .ex-search::placeholder { color: var(--subtle); }
    .ex-group-label {
      font-size: 10px; font-weight: 700; color: var(--subtle);
      text-transform: uppercase; letter-spacing: 1px; padding: 8px 20px 4px;
    }
    .ex-row {
      display: flex; align-items: center; padding: 11px 20px; cursor: pointer;
      transition: background 0.1s; gap: 10px; -webkit-tap-highlight-color: transparent;
    }
    .ex-row:active { background: rgba(255,255,255,0.04); }
    .ex-row.sel { background: rgba(193,88,26,0.1); }
    .ex-row-name { font-size: 14px; font-weight: 500; flex: 1; }
    .ex-row-muscle { font-size: 11px; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: 10px; }
    .free-selected-name { font-size: 13px; font-weight: 600; color: var(--orange); margin-bottom: 8px; min-height: 20px; }
    .ex-scheme-row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; margin-bottom: 10px; }
    .ex-scheme-input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--text); outline: none; width: 100%;
    }
    .ex-scheme-input:focus { border-color: var(--orange); }
    .ex-scheme-input::placeholder { color: var(--subtle); }
    .btn-add-free-ex {
      width: 100%; background: var(--orange); border: none; border-radius: 8px;
      padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      font-weight: 600; color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .btn-add-free-ex:hover { background: #D4651F; }
    .btn-add-free-ex:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- Bottom nav ---- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 4px; z-index: 100;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; flex: 1; padding: 10px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item svg { width: 22px; height: 22px; stroke: var(--subtle); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--subtle); letter-spacing: 0.2px; }
    .nav-item.active svg { stroke: var(--orange); }
    .nav-item.active .nav-label { color: var(--orange); }
  </style>
</head>
<body>

  <div class="page-header">
    <div>
      <div class="page-label">Today's</div>
      <div class="page-title">Workout</div>
      <div class="page-date" id="page-date">—</div>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-today"    onclick="switchTab('today')">Today</div>
    <div class="tab"        id="tab-week"     onclick="switchTab('week')">This Week</div>
    <div class="tab"        id="tab-plan"     onclick="switchTab('plan')">Full Plan</div>
  </div>

  <div class="content" id="main-content">
    <div class="loading-state">Loading your workout...</div>
  </div>

  <!-- Day Picker Sheet -->
  <div class="sheet-overlay" id="day-picker-sheet" onclick="if(event.target===this)closeDayPicker()">
    <div class="sheet">
      <div class="sheet-header">
        <div class="sheet-title">Pick a Workout</div>
        <button class="sheet-close" onclick="closeDayPicker()">✕</button>
      </div>
      <div class="sheet-body" id="day-picker-list"></div>
      <div class="sheet-footer">
        <button class="btn-free-session" onclick="startFreeSession()">+ Free Session — pick your own exercises</button>
      </div>
    </div>
  </div>

  <!-- Free Exercise Picker Sheet -->
  <div class="sheet-overlay" id="free-ex-sheet" onclick="if(event.target===this)closeFreeExPicker()">
    <div class="sheet">
      <div class="sheet-header">
        <div class="sheet-title">Add Exercise</div>
        <button class="sheet-close" onclick="closeFreeExPicker()">✕</button>
      </div>
      <input class="ex-search" id="free-ex-search" placeholder="Search exercises…" oninput="renderFreeExList()">
      <div class="sheet-body" id="free-ex-list"></div>
      <div class="sheet-footer">
        <div class="free-selected-name" id="free-ex-selected-name">Select an exercise above</div>
        <div class="ex-scheme-row">
          <input class="ex-scheme-input" id="free-sets" type="number" min="1" max="20" placeholder="Sets" inputmode="numeric">
          <input class="ex-scheme-input" id="free-scheme" placeholder="Reps / scheme (e.g. 8-12)">
        </div>
        <button class="btn-add-free-ex" id="btn-add-free-ex" onclick="addFreeExercise()" disabled>Add to Session</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="nav-label">Dashboard</span>
    </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>

    // ===== STATE =====
    let clientData   = null;
    let assignment   = null;
    let programme    = null;
    let allDays      = [];      // ordered list of all programme days
    let todayDay     = null;    // today's programme_day object
    let todayBlocks  = [];      // blocks for today
    let todayExs     = {};      // { block_id: [exercises] }
    let workoutLog   = null;    // today's workout_log row
    let loggedSets   = {};      // { exercise_id: { set_number: set_log_row } }
    let prevSets     = {};      // { exercise_id: { set_number: set_log_row } } from last session
    let activeTab    = 'today';
    let weekDays     = [];      // days in current programme week
    let scheduledDay = null;    // the day the programme actually puts you on today (never mutated)
    let isFreeSession  = false;
    let freeExercises  = [];    // [{tempId, name, muscle, sets, scheme}]
    let freeLoggedSets = {};    // {tempId: {setNum: row}}
    let freeExSelected = null;
    let freeExCounter  = 0;

    const FREE_EX_LIBRARY = [
      { name: 'Bench Press', muscle: 'Chest' }, { name: 'Incline Bench Press', muscle: 'Chest' },
      { name: 'Dumbbell Bench Press', muscle: 'Chest' }, { name: 'Incline DB Press', muscle: 'Chest' },
      { name: 'Dumbbell Flyes', muscle: 'Chest' }, { name: 'Cable Crossover', muscle: 'Chest' },
      { name: 'Push-Ups', muscle: 'Chest' }, { name: 'Dips', muscle: 'Chest' }, { name: 'Pec Deck', muscle: 'Chest' },
      { name: 'Pull-Ups', muscle: 'Back' }, { name: 'Chin-Ups', muscle: 'Back' }, { name: 'Lat Pulldown', muscle: 'Back' },
      { name: 'Barbell Row', muscle: 'Back' }, { name: 'Dumbbell Row', muscle: 'Back' },
      { name: 'Cable Row', muscle: 'Back' }, { name: 'T-Bar Row', muscle: 'Back' }, { name: 'Face Pull', muscle: 'Back' },
      { name: 'Straight-Arm Pulldown', muscle: 'Back' }, { name: 'Rack Pull', muscle: 'Back' },
      { name: 'Overhead Press', muscle: 'Shoulders' }, { name: 'DB Shoulder Press', muscle: 'Shoulders' },
      { name: 'Arnold Press', muscle: 'Shoulders' }, { name: 'Lateral Raises', muscle: 'Shoulders' },
      { name: 'Front Raises', muscle: 'Shoulders' }, { name: 'Rear Delt Flyes', muscle: 'Shoulders' },
      { name: 'Cable Lateral Raises', muscle: 'Shoulders' }, { name: 'Shrugs', muscle: 'Shoulders' },
      { name: 'Barbell Curl', muscle: 'Biceps' }, { name: 'Dumbbell Curl', muscle: 'Biceps' },
      { name: 'Hammer Curl', muscle: 'Biceps' }, { name: 'Preacher Curl', muscle: 'Biceps' },
      { name: 'Cable Curl', muscle: 'Biceps' }, { name: 'Concentration Curl', muscle: 'Biceps' },
      { name: 'Tricep Pushdown', muscle: 'Triceps' }, { name: 'Skull Crushers', muscle: 'Triceps' },
      { name: 'Close-Grip Bench', muscle: 'Triceps' }, { name: 'Overhead Tricep Ext.', muscle: 'Triceps' },
      { name: 'Diamond Push-Ups', muscle: 'Triceps' },
      { name: 'Back Squat', muscle: 'Quads' }, { name: 'Front Squat', muscle: 'Quads' },
      { name: 'Leg Press', muscle: 'Quads' }, { name: 'Bulgarian Split Squat', muscle: 'Quads' },
      { name: 'Lunges', muscle: 'Quads' }, { name: 'Hack Squat', muscle: 'Quads' },
      { name: 'Leg Extension', muscle: 'Quads' }, { name: 'Step-Ups', muscle: 'Quads' },
      { name: 'Romanian Deadlift', muscle: 'Hamstrings' }, { name: 'Leg Curl', muscle: 'Hamstrings' },
      { name: 'Seated Leg Curl', muscle: 'Hamstrings' }, { name: 'Stiff-Leg Deadlift', muscle: 'Hamstrings' },
      { name: 'Nordic Curl', muscle: 'Hamstrings' }, { name: 'Good Morning', muscle: 'Hamstrings' },
      { name: 'Hip Thrust', muscle: 'Glutes' }, { name: 'Glute Bridge', muscle: 'Glutes' },
      { name: 'Sumo Deadlift', muscle: 'Glutes' }, { name: 'Cable Kickback', muscle: 'Glutes' },
      { name: 'Standing Calf Raise', muscle: 'Calves' }, { name: 'Seated Calf Raise', muscle: 'Calves' },
      { name: 'Leg Press Calf Raise', muscle: 'Calves' },
      { name: 'Plank', muscle: 'Core' }, { name: 'Ab Rollout', muscle: 'Core' },
      { name: 'Cable Crunch', muscle: 'Core' }, { name: 'Hanging Leg Raise', muscle: 'Core' },
      { name: 'Russian Twist', muscle: 'Core' }, { name: 'Dead Bug', muscle: 'Core' },
      { name: 'Pallof Press', muscle: 'Core' }, { name: 'Side Plank', muscle: 'Core' },
      { name: 'Deadlift', muscle: 'Full Body' }, { name: 'Power Clean', muscle: 'Full Body' },
      { name: 'Clean & Press', muscle: 'Full Body' }, { name: 'Kettlebell Swing', muscle: 'Full Body' },
      { name: "Farmer's Walk", muscle: 'Full Body' }, { name: 'Burpees', muscle: 'Full Body' },
      { name: 'Box Jump', muscle: 'Full Body' }, { name: 'Thruster', muscle: 'Full Body' },
    ];

    // Use local date (not UTC) so it's consistent with getDay() for day-of-week matching
    const _now      = new Date();
    const today     = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
    const DAY_MS    = 864e5;

    document.getElementById('page-date').textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    // ===== BOOT =====
    (async () => {
      const session = await requireClient();
      if (!session) return;

      clientData = await getCurrentClient(session.user.id);
      if (!clientData) return;

      // Get programme from client record
      if (!clientData.programme_id) { renderNoProgramme(); return; }

      const { data: prog } = await db
        .from('programmes')
        .select('*')
        .eq('id', clientData.programme_id)
        .maybeSingle();

      if (!prog) { renderNoProgramme(); return; }

      assignment = {
        id:         null,
        start_date: clientData.programme_start_date || today,
      };
      programme = prog;

      // Load all weeks and days
      const { data: weeks } = await db
        .from('programme_weeks')
        .select('*')
        .eq('programme_id', programme.id)
        .order('week_number');

      if (!weeks?.length) { renderNoProgramme(); return; }

      const { data: days } = await db
        .from('programme_days')
        .select('*')
        .in('week_id', weeks.map(w => w.id))
        .order('day_number');

      // Build ordered day list: week1-day1, week1-day2, ... week2-day1 ...
      allDays = weeks.flatMap(w =>
        (days || [])
          .filter(d => d.week_id === w.id)
          .sort((a, b) => a.day_number - b.day_number)
          .map(d => ({ ...d, week_number: w.week_number }))
      );

      if (!allDays.length) { renderNoProgramme(); return; }

      // Figure out which week of the programme we're in
      const startDate    = new Date(assignment.start_date + 'T00:00:00');
      const todayDate    = new Date(today + 'T00:00:00');
      const daysElapsed  = Math.max(0, Math.round((todayDate - startDate) / DAY_MS));
      const weeksElapsed = Math.floor(daysElapsed / 7);

      const uniqueWeekNums = [...new Set(allDays.map(d => d.week_number))].sort((a, b) => a - b);
      const currentWeekNum = uniqueWeekNums[weeksElapsed % uniqueWeekNums.length];

      // Match today's day of week to day_number (Mon=1 … Sun=7)
      const jsDay       = new Date().getDay();
      const todayDayNum = jsDay === 0 ? 7 : jsDay;

      todayDay     = allDays.find(d => d.week_number === currentWeekNum && d.day_number === todayDayNum)
                     || { id: null, day_type: 'rest', label: 'Rest Day', week_number: currentWeekNum, day_number: todayDayNum };
      scheduledDay = todayDay;

      // Week days for the current programme week
      weekDays = allDays.filter(d => d.week_number === currentWeekNum);

      // Load today's blocks + exercises if workout day
      if (todayDay.day_type === 'workout') {
        const { data: blocks } = await db
          .from('workout_blocks')
          .select('*')
          .eq('day_id', todayDay.id)
          .order('sort_order');

        todayBlocks = blocks || [];

        if (todayBlocks.length) {
          const { data: exs } = await db
            .from('block_exercises')
            .select('*')
            .in('block_id', todayBlocks.map(b => b.id))
            .order('sort_order');

          todayBlocks.forEach(b => {
            todayExs[b.id] = (exs || []).filter(e => e.block_id === b.id);
          });
        }

        // Check for existing workout log today
        const { data: log } = await db
          .from('workout_logs')
          .select('*')
          .eq('client_id', clientData.id)
          .eq('programme_day_id', todayDay.id)
          .eq('log_date', today)
          .maybeSingle();

        if (log) {
          workoutLog = log;
          // Load already-logged sets
          const { data: sets } = await db
            .from('set_logs')
            .select('*')
            .eq('workout_log_id', log.id);

          (sets || []).forEach(s => {
            if (!loggedSets[s.block_exercise_id]) loggedSets[s.block_exercise_id] = {};
            loggedSets[s.block_exercise_id][s.set_number] = s;
          });
        }

        // Load previous session sets for same programme day
        const { data: prevLog } = await db
          .from('workout_logs')
          .select('id')
          .eq('client_id', clientData.id)
          .eq('programme_day_id', todayDay.id)
          .neq('log_date', today)
          .order('log_date', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (prevLog) {
          const { data: pSets } = await db
            .from('set_logs')
            .select('*')
            .eq('workout_log_id', prevLog.id);

          (pSets || []).forEach(s => {
            if (!prevSets[s.block_exercise_id]) prevSets[s.block_exercise_id] = {};
            prevSets[s.block_exercise_id][s.set_number] = s;
          });
        }
      }

      renderTab();
    })();

    // ===== TABS =====
    function switchTab(tab) {
      activeTab = tab;
      ['today','week','plan'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      });
      renderTab();
    }

    function renderTab() {
      if (activeTab === 'today') renderToday();
      else if (activeTab === 'week') renderWeek();
      else renderPlan();
    }

    // ===== TODAY TAB =====
    function renderToday() {
      const el = document.getElementById('main-content');

      if (isFreeSession) { renderFreeSession(el); return; }

      if (!todayDay) { el.innerHTML = '<div class="loading-state">Loading...</div>'; return; }

      if (todayDay.day_type === 'rest') {
        el.innerHTML = `
          <div class="card">
            <div class="rest-card">
              <div class="rest-icon">😴</div>
              <div class="rest-title">Rest Day</div>
              <p class="rest-sub">Week ${todayDay.week_number} · Day ${todayDay.day_number}<br>Recovery is part of the programme.</p>
              <button onclick="openDayPicker()" class="btn-switch" style="margin-top:20px">↕ Switch to a workout</button>
            </div>
          </div>
          ${cardioSection()}
        `;
        bindCardio();
        return;
      }

      // Workout day
      const isSwitched = todayDay.id !== scheduledDay?.id;
      let html = `<div class="card" style="margin-bottom:12px;padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase">${esc(todayDay.label || 'Workout')}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Week ${todayDay.week_number} · Day ${todayDay.day_number}${isSwitched ? ' <span style="color:var(--blue)">· Switched</span>' : ''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            ${programme?.name ? `<div style="font-size:12px;color:var(--muted)">${esc(programme.name)}</div>` : ''}
            <button onclick="openDayPicker()" class="btn-switch">↕ Switch</button>
          </div>
        </div>
      </div>`;

      if (!todayBlocks.length) {
        html += `<div class="card"><p style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0">No exercises added to this day yet.</p></div>`;
      } else {
        todayBlocks.forEach(block => {
          const exs  = todayExs[block.id] || [];
          const tier = block.tier.toLowerCase();
          const bannerId = `banner-${block.id}`;

          const ssLabels  = getSupersetLabels(exs);
          const hasSuperset = ssLabels.some(l => l !== null);
          html += `<div class="card block-section" id="block-${block.id}">
            <div class="block-header">
              <span class="tier-badge ${tier}">${block.tier}</span>
              <span class="block-desc">${tierDesc(tier)}</span>
              ${hasSuperset ? '<span class="superset-tag">Superset</span>' : ''}
            </div>`;

          if (!exs.length) {
            html += `<p style="font-size:13px;color:var(--subtle)">No exercises in this block.</p>`;
          } else {
            exs.forEach((ex, exIdx) => {
              const sets   = parseSets(ex.sets, ex.rep_scheme);
              const target = ex.target_weight_kg;
              const prev   = prevSets[ex.id] || {};
              const logged = loggedSets[ex.id] || {};
              const label  = ssLabels[exIdx];

              const isBW   = ex.weight_type === 'bw';
              const isBand = ex.weight_type === 'band';
              const wtLabel = isBW ? 'BW' : isBand ? 'Band' : null;

              html += `<div class="exercise-card" id="ex-${ex.id}">
                <div class="exercise-header">
                  <div>
                    <div class="exercise-name">
                      ${label ? `<span class="ss-label">${label}</span>` : ''}
                      ${esc(ex.exercise_name)}
                      ${ex.is_dropset ? '<span class="dropset-tag">↓ Drop</span>' : ''}
                      ${wtLabel ? `<span style="font-size:10px;font-weight:700;color:var(--blue);background:rgba(91,155,213,0.12);border-radius:4px;padding:2px 6px;margin-left:4px">${wtLabel}</span>` : ''}
                    </div>
                    <div class="exercise-meta">${ex.rep_scheme || `${sets} sets`}${ex.muscle_group ? ' · ' + ex.muscle_group : ''}</div>
                  </div>
                  ${target && !wtLabel ? `<div class="exercise-target">
                    <div class="target-val">${target}kg</div>
                    <div class="target-label">Target</div>
                  </div>` : ''}
                </div>

                <div class="sets-header">
                  <span>Set</span><span>${wtLabel || 'Weight'}</span><span>Reps</span><span>Log</span>
                </div>`;

              for (let s = 1; s <= sets; s++) {
                const p = prev[s];
                const l = logged[s];
                const isDone = !!l;
                const wtCell = wtLabel
                  ? `<div style="display:flex;align-items:center;height:44px">
                      <input id="w-${ex.id}-${s}" type="hidden" value="${wtLabel}">
                      <span style="font-size:12px;font-weight:700;color:var(--blue);background:rgba(91,155,213,0.12);border:1px solid rgba(91,155,213,0.25);border-radius:6px;padding:5px 10px">${wtLabel}</span>
                     </div>
                     ${p ? `<div class="prev-val">${p.reps_completed} reps prev</div>` : ''}`
                  : `<input class="set-input ${isDone ? 'logged' : ''}"
                      id="w-${ex.id}-${s}" type="number" step="0.5" min="0"
                      placeholder="${p ? p.weight_kg : (target || '—')}"
                      value="${isDone ? l.weight_kg : ''}"
                      inputmode="decimal" ${isDone ? 'readonly' : ''}>
                    ${p ? `<div class="prev-val">${p.weight_kg}kg prev</div>` : ''}`;
                html += `<div class="set-row" id="set-${ex.id}-${s}">
                  <div class="set-num">${s}</div>
                  <div>${wtCell}</div>
                  <div>
                    <input class="set-input ${isDone ? 'logged' : ''}"
                      id="r-${ex.id}-${s}" type="number" step="1" min="0"
                      placeholder="${p ? p.reps_completed : '—'}"
                      value="${isDone ? l.reps_completed : ''}"
                      inputmode="numeric" ${isDone ? 'readonly' : ''}>
                    ${p ? `<div class="prev-val">${p.reps_completed} reps prev</div>` : ''}
                  </div>
                  <div>
                    <button class="btn-log-set ${isDone ? 'done' : ''}"
                      id="btn-${ex.id}-${s}"
                      ${isDone ? 'disabled' : `onclick="logSet('${ex.id}','${block.id}',${s},${sets},'${ex.weight_type||'kg'}')"`}>
                      ${isDone ? 'Logged' : 'Log'}
                    </button>
                  </div>
                </div>`;
              }

              // Drop set row — appears after final regular set
              if (ex.is_dropset) {
                const dropSetNum = sets + 1;
                const dp = prev[dropSetNum];
                const dl = logged[dropSetNum];
                const dropDone = !!dl;
                html += `<div class="set-row drop-row" id="set-${ex.id}-${dropSetNum}">
                  <div class="set-num">↓</div>
                  <div>
                    <input class="set-input ${dropDone ? 'logged' : ''}"
                      id="w-${ex.id}-${dropSetNum}" type="number" step="0.5" min="0"
                      placeholder="${dp ? dp.weight_kg : '↓ wt'}"
                      value="${dropDone ? dl.weight_kg : ''}"
                      inputmode="decimal" ${dropDone ? 'readonly' : ''}>
                    ${dp ? `<div class="prev-val">${dp.weight_kg}kg prev</div>` : ''}
                  </div>
                  <div>
                    <input class="set-input ${dropDone ? 'logged' : ''}"
                      id="r-${ex.id}-${dropSetNum}" type="number" step="1" min="0"
                      placeholder="${dp ? dp.reps_completed : 'AMRAP'}"
                      value="${dropDone ? dl.reps_completed : ''}"
                      inputmode="numeric" ${dropDone ? 'readonly' : ''}>
                    ${dp ? `<div class="prev-val">${dp.reps_completed} reps prev</div>` : ''}
                  </div>
                  <div>
                    <button class="btn-log-set ${dropDone ? 'done' : ''}"
                      id="btn-${ex.id}-${dropSetNum}"
                      ${dropDone ? 'disabled' : `onclick="logSet('${ex.id}','${block.id}',${dropSetNum},${sets})"`}>
                      ${dropDone ? 'Logged' : 'Log'}
                    </button>
                  </div>
                </div>`;
              }

              html += `</div>`; // exercise-card
            });
          }

          // Completion banner
          const allDoneForBlock = exs.every(ex => {
            const sets   = ex.sets || 3;
            const logged = loggedSets[ex.id] || {};
            return Array.from({length: sets}, (_,i) => i+1).every(s => logged[s]);
          });

          const msg = tier === 'win'
            ? "You won the workout — let's win the day"
            : tier === 'bonus'
            ? "Let's gooo!"
            : "Money! Didn't just win the workout — got the extras. Let's gooooo!";

          html += `<div class="completion-banner ${tier}-done" id="${bannerId}"
            style="${allDoneForBlock && exs.length ? 'display:block' : 'display:none'}">
            <div class="completion-text">${msg}</div>
          </div>`;

          html += `</div>`; // card
        });
      }

      html += cardioSection();
      el.innerHTML = html;
      bindCardio();
    }

    // ===== LOG A SET =====
    async function logSet(exId, blockId, setNum, totalSets, weightType = 'kg') {
      const wInput  = document.getElementById(`w-${exId}-${setNum}`);
      const rInput  = document.getElementById(`r-${exId}-${setNum}`);
      const btn     = document.getElementById(`btn-${exId}-${setNum}`);
      const isBwBand = weightType === 'bw' || weightType === 'band';

      const weight = isBwBand ? null : parseFloat(wInput.value);
      const reps   = parseInt(rInput.value);

      if (!isBwBand && !weight) { wInput.style.borderColor = 'var(--orange)'; return; }
      if (!reps) { rInput.style.borderColor = 'var(--orange)'; return; }
      if (wInput.style) wInput.style.borderColor = '';
      rInput.style.borderColor = '';

      btn.disabled    = true;
      btn.textContent = 'Saving…';

      // Create workout log if needed
      if (!workoutLog) {
        const { data: log, error } = await db
          .from('workout_logs')
          .insert({
            client_id:        clientData.id,
            programme_day_id: todayDay.id,
            assignment_id:    assignment.id,
            log_date:         today,
          })
          .select().single();

        if (error) { btn.disabled = false; btn.textContent = 'Log'; alert(error.message); return; }
        workoutLog = log;
      }

      // e1RM (Epley: weight × (1 + reps/30)) — null for BW/Band
      const e1rm = weight ? parseFloat((weight * (1 + reps / 30)).toFixed(1)) : null;

      const { data: setLog, error: setErr } = await db
        .from('set_logs')
        .insert({
          workout_log_id:   workoutLog.id,
          block_exercise_id: exId,
          set_number:        setNum,
          weight_kg:         weight,
          reps_completed:    reps,
          e1rm:              e1rm,
        })
        .select().single();

      if (setErr) { btn.disabled = false; btn.textContent = 'Log'; alert(setErr.message); return; }

      // Update local state
      if (!loggedSets[exId]) loggedSets[exId] = {};
      loggedSets[exId][setNum] = setLog;

      // Mark inputs as done
      wInput.classList.add('logged'); wInput.readOnly = true;
      rInput.classList.add('logged'); rInput.readOnly = true;
      btn.classList.add('done');
      btn.textContent = 'Logged';

      // Show e1rm under the row
      const setRow = document.getElementById(`set-${exId}-${setNum}`);
      const e1rmEl = document.createElement('div');
      e1rmEl.className = 'e1rm-row';
      e1rmEl.innerHTML = `e1RM: <span>${e1rm}kg</span>`;
      setRow.after(e1rmEl);

      // Check if block is complete → show banner
      checkBlockCompletion(blockId);

      // Any set logged = workout done
      await db.from('check_ins')
        .update({ win_completed: true })
        .eq('client_id', clientData.id)
        .eq('check_in_date', today);
    }

    function checkBlockCompletion(blockId) {
      const block  = todayBlocks.find(b => b.id === blockId);
      if (!block) return;
      const exs    = todayExs[blockId] || [];
      if (!exs.length) return;

      const allDone = exs.every(ex => {
        const sets   = ex.sets || 3;
        const logged = loggedSets[ex.id] || {};
        return Array.from({length: sets}, (_,i) => i+1).every(s => logged[s]);
      });

      if (allDone) {
        const banner = document.getElementById(`banner-${blockId}`);
        if (banner) banner.style.display = 'block';
      }
    }

    // ===== THIS WEEK TAB =====
    function renderWeek() {
      const el = document.getElementById('main-content');
      if (!weekDays.length) { el.innerHTML = '<div class="loading-state">No days in this week.</div>'; return; }

      const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      el.innerHTML = `
        <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">Week ${scheduledDay?.week_number || '?'} of ${programme?.total_weeks || '?'} · Tap a workout to do it</div>
        ${weekDays.map(d => {
          const isScheduled = d.id === scheduledDay?.id;
          const isActive    = !isFreeSession && d.id === todayDay?.id;
          const isTappable  = d.day_type === 'workout';
          return `<div class="week-day-item ${isScheduled ? 'today' : ''} ${isTappable ? 'tappable' : ''}"
            ${isTappable ? `onclick="switchToDay('${d.id}')"` : ''}>
            <div class="day-dot ${isActive ? 'today' : d.day_type}"></div>
            <div class="day-info">
              <strong>${dayNames[d.day_number - 1] || `Day ${d.day_number}`} — ${esc(d.label || d.day_type)}</strong>
              <span>${d.day_type === 'workout' ? 'Workout' : 'Rest'}</span>
            </div>
            ${isActive ? '<span class="today-pill">Active</span>' : isScheduled ? '<span class="today-pill" style="background:rgba(136,146,164,0.1);color:var(--muted)">Scheduled</span>' : d.day_type === 'workout' ? '<span style="font-size:14px;color:var(--subtle)">→</span>' : ''}
          </div>`;
        }).join('')}
        <div style="margin-top:12px">
          <button onclick="startFreeSession()" class="btn-free-session">+ Free Session — pick your own exercises</button>
        </div>
      `;
    }

    // ===== FULL PLAN TAB =====
    function renderPlan() {
      const el = document.getElementById('main-content');
      if (!allDays.length) { el.innerHTML = '<div class="loading-state">No programme loaded.</div>'; return; }

      // Group by week
      const byWeek = {};
      allDays.forEach(d => {
        if (!byWeek[d.week_number]) byWeek[d.week_number] = [];
        byWeek[d.week_number].push(d);
      });

      el.innerHTML = Object.entries(byWeek).map(([wNum, days]) => `
        <div class="plan-week">
          <div class="plan-week-header">Week ${wNum}</div>
          ${days.map(d => `
            <div class="plan-day-row ${d.id === todayDay?.id ? 'today' : ''}">
              <div class="plan-day-num">D${d.day_number}</div>
              <div class="plan-day-label">${esc(d.label || d.day_type)}</div>
              <div class="plan-day-type ${d.day_type}">${d.day_type === 'workout' ? 'Workout' : 'Rest'}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    // ===== NO PROGRAMME =====
    function renderNoProgramme() {
      document.getElementById('main-content').innerHTML = `
        <div class="card">
          <div class="no-prog">
            <p style="font-size:32px;margin-bottom:12px">🏋️</p>
            <p>No programme assigned yet.<br>Your coach will set one up for you.</p>
            <button onclick="startFreeSession()" style="margin-top:20px;background:none;border:1px solid var(--border);border-radius:8px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer">+ Start Free Session</button>
          </div>
        </div>
        ${cardioSection()}
      `;
      bindCardio();
    }

    // ===== CARDIO =====
    function cardioSection() {
      return `
        <button class="cardio-btn" onclick="toggleCardio()">+ Log Cardio</button>
        <div class="cardio-form" id="cardio-form">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Cardio Session</div>
          <div class="cardio-grid">
            <div>
              <label class="field-label">Type</label>
              <select class="form-select" id="c-type">
                <option value="run">Run</option>
                <option value="walk">Walk</option>
                <option value="cycle">Cycle</option>
                <option value="row">Row</option>
                <option value="swim">Swim</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div>
              <label class="field-label">Duration (min)</label>
              <input class="form-input" id="c-duration" type="number" min="1" placeholder="e.g. 30" inputmode="numeric">
            </div>
            <div>
              <label class="field-label">Distance (km)</label>
              <input class="form-input" id="c-distance" type="number" step="0.1" min="0" placeholder="optional" inputmode="decimal">
            </div>
            <div>
              <label class="field-label">Notes</label>
              <input class="form-input" id="c-notes" placeholder="optional">
            </div>
          </div>
          <button class="btn-save-cardio" onclick="saveCardio()">Save Cardio</button>
        </div>
      `;
    }

    function bindCardio() {
      // no-op — onclick handles it inline
    }

    function toggleCardio() {
      document.getElementById('cardio-form').classList.toggle('open');
    }

    async function saveCardio() {
      const type     = document.getElementById('c-type').value;
      const duration = parseInt(document.getElementById('c-duration').value) || null;
      const distance = parseFloat(document.getElementById('c-distance').value) || null;
      const notes    = document.getElementById('c-notes').value.trim() || null;

      if (!duration) { alert('Please enter duration.'); return; }

      const { error } = await db.from('cardio_logs').insert({
        client_id:    clientData.id,
        log_date:     today,
        cardio_type:  type,
        duration_min: duration,
        distance_km:  distance,
        notes,
      });

      if (error) { alert(error.message); return; }

      document.getElementById('cardio-form').classList.remove('open');
      // Quick confirmation
      const btn = document.querySelector('.cardio-btn');
      if (btn) { btn.textContent = '✓ Cardio Logged'; btn.style.color = 'var(--green)'; btn.style.borderColor = 'var(--green)'; }
    }

    // ===== DAY PICKER =====
    function openDayPicker() {
      const workoutDays = allDays.filter(d => d.day_type === 'workout');
      const byWeek = {};
      workoutDays.forEach(d => {
        if (!byWeek[d.week_number]) byWeek[d.week_number] = [];
        byWeek[d.week_number].push(d);
      });
      const activeId = isFreeSession ? null : todayDay?.id;
      document.getElementById('day-picker-list').innerHTML = Object.entries(byWeek).map(([wNum, days]) => `
        <div class="picker-week-label">Week ${wNum}</div>
        ${days.map(d => `
          <div class="picker-day-row ${d.id === activeId ? 'is-active' : ''}" onclick="switchToDay('${d.id}')">
            <div class="picker-day-dot"></div>
            <div class="picker-day-name">${esc(d.label || 'Workout')}</div>
            <div class="picker-day-meta">Day ${d.day_number}${d.id === activeId ? ' · Active' : ''}</div>
          </div>
        `).join('')}
      `).join('');
      document.getElementById('day-picker-sheet').classList.add('open');
    }

    function closeDayPicker() {
      document.getElementById('day-picker-sheet').classList.remove('open');
    }

    async function switchToDay(dayId) {
      const target = allDays.find(d => d.id === dayId);
      if (!target) return;
      closeDayPicker();
      isFreeSession = false;

      document.getElementById('main-content').innerHTML = '<div class="loading-state">Loading workout…</div>';

      todayDay    = target;
      todayBlocks = [];
      todayExs    = {};
      workoutLog  = null;
      loggedSets  = {};
      prevSets    = {};

      if (target.day_type === 'workout') {
        const { data: blocks } = await db.from('workout_blocks').select('*').eq('day_id', target.id).order('sort_order');
        todayBlocks = blocks || [];

        if (todayBlocks.length) {
          const { data: exs } = await db.from('block_exercises').select('*')
            .in('block_id', todayBlocks.map(b => b.id)).order('sort_order');
          todayBlocks.forEach(b => { todayExs[b.id] = (exs || []).filter(e => e.block_id === b.id); });
        }

        const { data: log } = await db.from('workout_logs').select('*')
          .eq('client_id', clientData.id).eq('programme_day_id', target.id)
          .eq('log_date', today).maybeSingle();

        if (log) {
          workoutLog = log;
          const { data: sets } = await db.from('set_logs').select('*').eq('workout_log_id', log.id);
          (sets || []).forEach(s => {
            if (!loggedSets[s.block_exercise_id]) loggedSets[s.block_exercise_id] = {};
            loggedSets[s.block_exercise_id][s.set_number] = s;
          });
        }

        const { data: prevLog } = await db.from('workout_logs').select('id')
          .eq('client_id', clientData.id).eq('programme_day_id', target.id)
          .neq('log_date', today).order('log_date', { ascending: false }).limit(1).maybeSingle();

        if (prevLog) {
          const { data: pSets } = await db.from('set_logs').select('*').eq('workout_log_id', prevLog.id);
          (pSets || []).forEach(s => {
            if (!prevSets[s.block_exercise_id]) prevSets[s.block_exercise_id] = {};
            prevSets[s.block_exercise_id][s.set_number] = s;
          });
        }
      }

      // Jump to Today tab
      activeTab = 'today';
      ['today','week','plan'].forEach(t => document.getElementById(`tab-${t}`).classList.toggle('active', t === 'today'));
      renderToday();
    }

    // ===== FREE SESSION =====
    function startFreeSession() {
      closeDayPicker();
      isFreeSession  = true;
      freeExercises  = [];
      freeLoggedSets = {};
      freeExCounter  = 0;
      workoutLog     = null;

      activeTab = 'today';
      ['today','week','plan'].forEach(t => document.getElementById(`tab-${t}`).classList.toggle('active', t === 'today'));
      renderToday();
    }

    function renderFreeSession(el) {
      let html = `<div class="card" style="margin-bottom:12px;padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase">Free Session</div>
            <div style="font-size:12px;color:var(--blue);margin-top:2px">Your own workout</div>
          </div>
          <button onclick="openDayPicker()" class="btn-switch">↕ Switch</button>
        </div>
      </div>`;

      if (!freeExercises.length) {
        html += `<div class="card">
          <div style="text-align:center;padding:32px 20px">
            <div style="font-size:40px;margin-bottom:14px">🏋️</div>
            <p style="font-size:14px;color:var(--muted);margin-bottom:22px">Add exercises to build your session</p>
            <button onclick="openFreeExPicker()" style="background:var(--orange);border:none;border-radius:10px;padding:13px 30px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:#fff;cursor:pointer">+ Add Exercise</button>
          </div>
        </div>`;
      } else {
        freeExercises.forEach(ex => {
          const logged = freeLoggedSets[ex.tempId] || {};
          html += `<div class="card block-section">
            <div class="exercise-header" style="margin-bottom:12px">
              <div>
                <div class="exercise-name">${esc(ex.name)}</div>
                <div class="exercise-meta">${ex.scheme ? ex.scheme : `${ex.sets} sets`}${ex.muscle ? ' · ' + ex.muscle : ''}</div>
              </div>
            </div>
            <div class="sets-header">
              <span>Set</span><span>Weight</span><span>Reps</span><span>Log</span>
            </div>`;

          for (let s = 1; s <= ex.sets; s++) {
            const l = logged[s];
            const isDone = !!l;
            html += `<div class="set-row" id="free-set-${ex.tempId}-${s}">
              <div class="set-num">${s}</div>
              <div>
                <input class="set-input ${isDone ? 'logged' : ''}" id="fw-${ex.tempId}-${s}"
                  type="number" step="0.5" min="0" placeholder="kg"
                  value="${isDone ? l.weight_kg : ''}" inputmode="decimal" ${isDone ? 'readonly' : ''}>
              </div>
              <div>
                <input class="set-input ${isDone ? 'logged' : ''}" id="fr-${ex.tempId}-${s}"
                  type="number" step="1" min="0" placeholder="reps"
                  value="${isDone ? l.reps_completed : ''}" inputmode="numeric" ${isDone ? 'readonly' : ''}>
              </div>
              <div>
                <button class="btn-log-set ${isDone ? 'done' : ''}" id="fbtn-${ex.tempId}-${s}"
                  ${isDone ? 'disabled' : `onclick="logFreeSet('${ex.tempId}',${s})"`}>
                  ${isDone ? 'Logged' : 'Log'}
                </button>
              </div>
            </div>`;
          }
          html += `</div>`; // card
        });

        html += `<button class="cardio-btn" style="border-style:solid" onclick="openFreeExPicker()">+ Add Another Exercise</button>`;
      }

      html += cardioSection();
      el.innerHTML = html;
      bindCardio();
    }

    function openFreeExPicker() {
      freeExSelected = null;
      document.getElementById('free-ex-search').value        = '';
      document.getElementById('free-sets').value             = '';
      document.getElementById('free-scheme').value           = '';
      document.getElementById('free-ex-selected-name').textContent = 'Select an exercise above';
      document.getElementById('btn-add-free-ex').disabled    = true;
      renderFreeExList();
      document.getElementById('free-ex-sheet').classList.add('open');
      setTimeout(() => document.getElementById('free-ex-search').focus(), 80);
    }

    function closeFreeExPicker() {
      document.getElementById('free-ex-sheet').classList.remove('open');
    }

    function renderFreeExList() {
      const q = (document.getElementById('free-ex-search').value || '').trim().toLowerCase();
      const filtered = FREE_EX_LIBRARY.filter(ex =>
        !q || ex.name.toLowerCase().includes(q) || ex.muscle.toLowerCase().includes(q)
      );
      const groups = {};
      filtered.forEach(ex => {
        if (!groups[ex.muscle]) groups[ex.muscle] = [];
        groups[ex.muscle].push(ex);
      });
      document.getElementById('free-ex-list').innerHTML = Object.entries(groups).map(([muscle, exs]) => `
        <div class="ex-group-label">${muscle}</div>
        ${exs.map(ex => `
          <div class="ex-row ${freeExSelected?.name === ex.name ? 'sel' : ''}" onclick="selectFreeEx('${esc(ex.name)}','${ex.muscle}')">
            <span class="ex-row-name">${esc(ex.name)}</span>
            <span class="ex-row-muscle">${ex.muscle}</span>
          </div>
        `).join('')}
      `).join('') || '<div style="padding:20px;color:var(--subtle);font-size:13px;text-align:center">No exercises found</div>';
    }

    function selectFreeEx(name, muscle) {
      freeExSelected = { name, muscle };
      document.getElementById('free-ex-selected-name').textContent = name;
      document.getElementById('btn-add-free-ex').disabled = false;
      renderFreeExList();
    }

    function addFreeExercise() {
      if (!freeExSelected) return;
      const setsVal = parseInt(document.getElementById('free-sets').value) || 3;
      const scheme  = document.getElementById('free-scheme').value.trim();
      freeExercises.push({
        tempId: 'f' + (++freeExCounter),
        name:   freeExSelected.name,
        muscle: freeExSelected.muscle,
        sets:   setsVal,
        scheme: scheme || null,
      });
      closeFreeExPicker();
      renderFreeSession(document.getElementById('main-content'));
    }

    async function logFreeSet(tempId, setNum) {
      const ex     = freeExercises.find(e => e.tempId === tempId);
      if (!ex) return;
      const wInput = document.getElementById(`fw-${tempId}-${setNum}`);
      const rInput = document.getElementById(`fr-${tempId}-${setNum}`);
      const btn    = document.getElementById(`fbtn-${tempId}-${setNum}`);

      const weight = parseFloat(wInput.value);
      const reps   = parseInt(rInput.value);

      if (!weight || !reps) {
        wInput.style.borderColor = !weight ? 'var(--orange)' : '';
        rInput.style.borderColor = !reps   ? 'var(--orange)' : '';
        return;
      }

      btn.disabled = true; btn.textContent = 'Saving…';

      if (!workoutLog) {
        const { data: log, error } = await db.from('workout_logs').insert({
          client_id:        clientData.id,
          programme_day_id: null,
          assignment_id:    null,
          log_date:         today,
        }).select().single();
        if (error) { btn.disabled = false; btn.textContent = 'Log'; alert(error.message); return; }
        workoutLog = log;
      }

      const e1rm = parseFloat((weight * (1 + reps / 30)).toFixed(1));

      const { data: setLog, error: setErr } = await db.from('set_logs').insert({
        workout_log_id:    workoutLog.id,
        block_exercise_id: null,
        exercise_name:     ex.name,
        set_number:        setNum,
        weight_kg:         weight,
        reps_completed:    reps,
        e1rm:              e1rm,
      }).select().single();

      if (setErr) { btn.disabled = false; btn.textContent = 'Log'; alert(setErr.message); return; }

      if (!freeLoggedSets[tempId]) freeLoggedSets[tempId] = {};
      freeLoggedSets[tempId][setNum] = setLog;

      wInput.classList.add('logged'); wInput.readOnly = true;
      rInput.classList.add('logged'); rInput.readOnly = true;
      btn.classList.add('done'); btn.textContent = 'Logged';

      const setRow = document.getElementById(`free-set-${tempId}-${setNum}`);
      const e1rmEl = document.createElement('div');
      e1rmEl.className = 'e1rm-row';
      e1rmEl.innerHTML = `e1RM: <span>${e1rm}kg</span>`;
      setRow.after(e1rmEl);

      await db.from('check_ins')
        .update({ win_completed: true })
        .eq('client_id', clientData.id)
        .eq('check_in_date', today);
    }

    // ===== HELPERS =====
    function getSupersetLabels(exs) {
      const LETTERS = 'ABCDEFGHIJKLMNOP';
      const labels = [];
      let groupIdx = 0, inGroup = false, pos = 0;
      for (let i = 0; i < exs.length; i++) {
        if (inGroup) {
          pos++;
          labels.push(LETTERS[groupIdx] + pos);
          if (!exs[i].paired_with_next) { inGroup = false; groupIdx++; pos = 0; }
        } else {
          if (exs[i].paired_with_next) { inGroup = true; pos = 1; labels.push(LETTERS[groupIdx] + '1'); }
          else { labels.push(null); }
        }
      }
      return labels;
    }

    function tierDesc(tier) {
      if (tier === 'win')   return 'Key lift — non-negotiable';
      if (tier === 'bonus') return 'Supporting compound';
      return 'Finishing touches';
    }

    function parseSets(explicit, scheme) {
      if (explicit) return explicit;
      const m = (scheme || '').match(/^(\d+)\s*[x×]/i);
      return m ? parseInt(m[1]) : 3;
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
