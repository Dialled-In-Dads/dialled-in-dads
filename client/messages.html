<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dialed In Dads">
  <link rel="manifest" href="../manifest.json">
  <title>Message Coach — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1117;
      --surface: #131B2E;
      --border:  #1E2A3E;
      --orange:  #C1581A;
      --green:   #2ECC8A;
      --text:    #F0F4F8;
      --muted:   #8892A4;
      --subtle:  #4A5568;
      --nav-h:   64px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 24px);
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 24px 20px 0;
      margin-bottom: 20px;
    }
    .page-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .page-title { font-family: 'Anton', sans-serif; font-size: 30px; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1; }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 40px;
      text-align: center;
    }

    .coach-avatar {
      width: 72px; height: 72px;
      background: rgba(193,88,26,0.15);
      border: 2px solid rgba(193,88,26,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif; font-size: 28px; color: var(--orange);
      margin: 0 auto 16px;
    }

    .coach-name {
      font-size: 18px; font-weight: 600; margin-bottom: 4px;
    }

    .coach-sub {
      font-size: 13px; color: var(--muted); margin-bottom: 32px;
    }

    .whatsapp-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; max-width: 300px;
      padding: 16px 24px;
      background: #25D366;
      border: none; border-radius: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700;
      color: #fff; text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .whatsapp-btn:hover  { background: #20bd5a; }
    .whatsapp-btn:active { transform: scale(0.97); }

    .whatsapp-btn svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }

    .no-number {
      font-size: 14px; color: var(--muted); line-height: 1.5;
      max-width: 260px;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h); background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 4px; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; flex: 1; padding: 10px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item svg { width: 22px; height: 22px; stroke: var(--subtle); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--subtle); }
    .nav-item.active svg { stroke: var(--orange); }
    .nav-item.active .nav-label { color: var(--orange); }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-label">Contact</div>
    <div class="page-title">Message Coach</div>
  </div>

  <div class="content" id="content">
    <div style="color:var(--muted);font-size:14px">Loading...</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="check-in.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Check-In</span>
    </a>
    <a href="workout.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M6 12h12M3 7h3M18 7h3M3 17h3M18 17h3"/></svg>
      <span class="nav-label">Workout</span>
    </a>
    <a href="photos.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span class="nav-label">Photos</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    (async () => {
      const session = await requireAuth();
      if (!session) return;

      const client = await getCurrentClient(session.user.id);
      if (!client) return;

      const { data: coach } = await db
        .from('coaches')
        .select('name, whatsapp')
        .eq('id', client.coach_id)
        .maybeSingle();

      const content   = document.getElementById('content');
      const name      = coach?.name || 'Your Coach';
      const initial   = name.charAt(0).toUpperCase();
      const whatsapp  = coach?.whatsapp?.replace(/\D/g, ''); // digits only

      if (whatsapp) {
        const url = `https://wa.me/${whatsapp}`;
        content.innerHTML = `
          <div class="coach-avatar">${initial}</div>
          <div class="coach-name">${name}</div>
          <div class="coach-sub">Your Dialed In Dads coach</div>
          <a href="${url}" class="whatsapp-btn" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
            </svg>
            Open WhatsApp
          </a>`;
      } else {
        content.innerHTML = `
          <div class="coach-avatar">${initial}</div>
          <div class="coach-name">${name}</div>
          <div class="coach-sub" style="margin-bottom:16px">Your Dialed In Dads coach</div>
          <div class="no-number">Your coach hasn't set up WhatsApp messaging yet. Check back soon.</div>`;
      }
    })();
  </script>

</body>
</html>
