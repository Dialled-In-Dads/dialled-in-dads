<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dialed In Dads">
  <link rel="manifest" href="../manifest.json">
  <title>Dashboard — Dialed In Dads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0D1117;
      --surface:      #131B2E;
      --border:       #1E2A3E;
      --orange:       #C1581A;
      --orange-hover: #D4651F;
      --green:        #2ECC8A;
      --blue:         #5B9BD5;
      --text:         #F0F4F8;
      --muted:        #8892A4;
      --subtle:       #4A5568;
      --nav-h:        64px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 24px);
    }

    /* ---- Header ---- */
    .page-header {
      padding: 24px 20px 0;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .page-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
    }

    .page-title {
      font-family: 'Anton', sans-serif;
      font-size: 30px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
    }

    .page-date {
      font-size: 13px;
      color: var(--muted);
      margin-top: 5px;
    }

    .phase-pill {
      background: rgba(193, 88, 26, 0.15);
      border: 1px solid rgba(193, 88, 26, 0.3);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .signout-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--subtle);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .signout-btn:hover { border-color: var(--subtle); color: var(--muted); }

    /* ---- Content ---- */
    .content { padding: 0 16px; }

    /* ---- Loading ---- */
    .loading-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ---- Generic card ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---- TODAY'S GOALS CARD ---- */
    .today-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .today-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .today-day-tag {
      font-family: 'Anton', sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--orange);
      text-transform: uppercase;
    }

    .today-phase-tag {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .today-message {
      font-size: 15px;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .goals-pills {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .goal-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
    }

    .goal-pill-value {
      font-family: 'Anton', sans-serif;
      font-size: 17px;
      letter-spacing: 0.5px;
      color: var(--text);
      line-height: 1;
      margin-bottom: 5px;
    }

    .goal-pill-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ---- Workout preview (inside today card) ---- */
    .workout-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .workout-preview:hover,
    .workout-preview:active { border-color: var(--orange); }

    .workout-preview-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .workout-preview-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .workout-preview-exercise {
      font-size: 12px;
      color: var(--orange);
    }

    .workout-preview-rest {
      font-size: 12px;
      color: var(--muted);
    }

    .workout-preview-arrow {
      width: 18px;
      height: 18px;
      stroke: var(--orange);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---- Weight chart ---- */
    .chart-wrap {
      width: 100%;
      height: 100px;
      margin-top: 4px;
    }

    .chart-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ---- Goal progress card ---- */
    .goal-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .goal-start, .goal-target {
      font-size: 13px;
      color: var(--muted);
    }

    .goal-current {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .goal-current .unit {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .progress-bar-bg {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    .goal-meta {
      font-size: 12px;
      color: var(--subtle);
    }

    .goal-meta strong { color: var(--green); font-weight: 600; }

    /* ---- Habits this week ---- */
    .habits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .habit-tick {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .habit-tick.hit    { background: rgba(46, 204, 138, 0.15); color: var(--green); }
    .habit-tick.logged { background: rgba(91, 155, 213, 0.15); color: var(--blue); }
    .habit-tick.miss   { background: var(--border); color: var(--subtle); }

    .habit-label {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .habit-label strong {
      display: block;
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    /* ---- Streak ---- */
    .streak-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .streak-num {
      font-family: 'Anton', sans-serif;
      font-size: 42px;
      color: var(--orange);
      line-height: 1;
      letter-spacing: 1px;
    }

    .streak-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .streak-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* ---- Install banner ---- */
    .install-banner {
      display: none;
      position: fixed;
      bottom: calc(var(--nav-h) + 12px);
      left: 16px; right: 16px;
      background: var(--surface);
      border: 1px solid rgba(193,88,26,0.35);
      border-radius: 14px;
      padding: 14px 16px;
      z-index: 200;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .install-banner.show { display: flex; }
    .install-banner-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--orange); display: flex; align-items: center;
      justify-content: center; font-family: 'Anton', sans-serif;
      font-size: 16px; color: #fff; flex-shrink: 0;
    }
    .install-banner-text { flex: 1; }
    .install-banner-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .install-banner-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .install-banner-close {
      background: none; border: none; color: var(--subtle);
      font-size: 20px; cursor: pointer; padding: 4px; line-height: 1;
    }

    /* ---- Bottom nav ---- */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      flex: 1;
      padding: 10px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      stroke: var(--subtle); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--subtle);
      letter-spacing: 0.2px;
    }

    .nav-item.active svg   { stroke: var(--orange); }
    .nav-item.active .nav-label { color: var(--orange); }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="header-left">
      <div class="page-label" id="greeting">Good morning</div>
      <div class="page-title" id="client-name">—</div>
      <div class="page-date" id="page-date">—</div>
    </div>
    <div class="header-right">
      <div class="phase-pill" id="phase-pill">—</div>
      <button class="signout-btn" onclick="signOut()">Sign Out</button>
    </div>
  </div>

  <div class="content" id="main-content">
    <div class="loading-state">Loading your dashboard...</div>
  </div>

  <div class="install-banner" id="install-banner">
    <div class="install-banner-icon">DID</div>
    <div class="install-banner-text">
      <div class="install-banner-title">Add to Home Screen</div>
      <div class="install-banner-sub">Tap <strong>Share →</strong> then <strong>"Add to Home Screen"</strong> for the full app experience</div>
    </div>
    <button class="install-banner-close" onclick="dismissInstall()">×</button>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="check-in.html" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="nav-label">Check-In</span>
    </a>
    <a href="workout.html" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M6 5v14M18 5v14M6 12h12M3 7h3M18 7h3M3 17h3M18 17h3"/>
      </svg>
      <span class="nav-label">Workout</span>
    </a>
    <a href="photos.html" class="nav-item">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <span class="nav-label">Photos</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    const today = new Date().toISOString().split('T')[0];

    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 17) return 'Good afternoon';
      return 'Good evening';
    }

    function phaseLabel(phase) {
      if (phase === 'find_the_dial') return 'Find The Dial';
      if (phase === 'dialling_in')   return 'Dialling In';
      if (phase === 'dialled_in')    return 'Dialled In';
      return phase || '—';
    }

    function fmtDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    // ---- iOS install prompt ----
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = localStorage.getItem('install-dismissed');
    if (isIOS && !isStandalone && !dismissed) {
      setTimeout(() => document.getElementById('install-banner').classList.add('show'), 2000);
    }
    function dismissInstall() {
      document.getElementById('install-banner').classList.remove('show');
      localStorage.setItem('install-dismissed', '1');
    }

    // ---- Fetch today's workout day + main exercise ----
    async function getTodayWorkout(client) {
      if (!client.programme_id) return null;

      const { data: weeks } = await db.from('programme_weeks')
        .select('id, week_number')
        .eq('programme_id', client.programme_id)
        .order('week_number');

      if (!weeks?.length) return null;

      const { data: pDays } = await db.from('programme_days')
        .select('id, label, day_type, day_number, week_id')
        .in('week_id', weeks.map(w => w.id))
        .order('day_number');

      if (!pDays?.length) return null;

      const allDays = weeks.flatMap(w =>
        (pDays || [])
          .filter(d => d.week_id === w.id)
          .sort((a, b) => a.day_number - b.day_number)
      );

      const startDate   = new Date((client.programme_start_date || today) + 'T00:00:00');
      const todayDate   = new Date(today + 'T00:00:00');
      const elapsed     = Math.round((todayDate - startDate) / 86400000);
      const dayIndex    = ((elapsed % allDays.length) + allDays.length) % allDays.length;
      const todayDay    = allDays[dayIndex];

      if (todayDay.day_type !== 'workout') {
        return { label: todayDay.label || 'Rest Day', isRest: true, mainExercise: null };
      }

      // Get first exercise from win block (or first block)
      const { data: blocks } = await db.from('workout_blocks')
        .select('id, tier').eq('day_id', todayDay.id).order('sort_order').limit(3);

      let mainExercise = null;
      if (blocks?.length) {
        const winBlock = blocks.find(b => b.tier === 'win') || blocks[0];
        const { data: exs } = await db.from('block_exercises')
          .select('exercise_name, sets, rep_scheme')
          .eq('block_id', winBlock.id).order('sort_order').limit(1);
        if (exs?.length) {
          const ex = exs[0];
          const scheme = ex.rep_scheme || (ex.sets ? `${ex.sets} sets` : null);
          mainExercise = { name: ex.exercise_name, scheme };
        }
      }

      return { label: todayDay.label || 'Workout', isRest: false, mainExercise };
    }

    // ---- Boot ----
    (async () => {
      const session = await requireClient();
      if (!session) return;

      const client = await getCurrentClient(session.user.id);
      if (!client) return;

      document.getElementById('greeting').textContent    = greeting();
      document.getElementById('client-name').textContent = client.name || 'Champ';
      document.getElementById('page-date').textContent   = new Date().toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
      document.getElementById('phase-pill').textContent  = client.current_phase || phaseLabel(client.phase) || '—';

      const [
        { data: checkIns },
        { data: programme },
        todayWorkout,
      ] = await Promise.all([
        db.from('check_ins')
          .select('check_in_date, weight_kg, calories_yesterday, protein_yesterday_g, steps_yesterday, feeling_score, win_completed')
          .eq('client_id', client.id)
          .order('check_in_date', { ascending: false })
          .limit(30),
        client.programme_id
          ? db.from('programmes').select('name').eq('id', client.programme_id).maybeSingle()
          : Promise.resolve({ data: null }),
        getTodayWorkout(client),
      ]);

      renderDashboard(client, checkIns || [], programme, todayWorkout);
    })();

    // ---- Render ----
    function renderDashboard(client, checkIns, programme, todayWorkout) {
      const latest  = checkIns[0] || null;
      const streak  = calcStreak(checkIns);

      // Programme day number (days since start, 1-indexed)
      const startDate  = client.programme_start_date || today;
      const dayNum     = Math.round(
        (new Date(today + 'T00:00:00') - new Date(startDate + 'T00:00:00')) / 86400000
      ) + 1;

      // Motivational message
      const firstName = (client.name || 'champ').split(/[\s.]/)[0];
      const capName   = firstName.charAt(0).toUpperCase() + firstName.slice(1).toLowerCase();
      const message   = (client.daily_note && client.daily_note_date === today) ? client.daily_note : autoMessage(dayNum, streak, capName);

      // This week habits
      const weekStart     = getWeekStart();
      const thisWeek      = checkIns.filter(c => c.check_in_date >= weekStart);
      const habCalsLogged = thisWeek.filter(c => c.calories_yesterday != null).length;
      const habCalsHit    = client.goal_calories
        ? thisWeek.filter(c => c.calories_yesterday != null && c.calories_yesterday <= client.goal_calories * 1.05).length
        : null;
      const habWorkout    = thisWeek.filter(c => c.win_completed).length;
      const habSteps      = client.goal_steps
        ? thisWeek.filter(c => c.steps_yesterday != null && c.steps_yesterday >= client.goal_steps).length
        : null;

      // Weight chart + goal progress
      const chartData     = checkIns.filter(c => c.weight_kg).slice(0, 14).reverse();
      const targetWeight  = client.goal_weight || null;
      const currentWeight = latest?.weight_kg || null;

      let html = '';

      // ---- Today's Goals ----
      const calsDisplay    = client.goal_calories ? client.goal_calories.toLocaleString() : '—';
      const proteinDisplay = client.goal_protein  ? client.goal_protein + 'g'             : '—';
      const stepsDisplay   = client.goal_steps
        ? (client.goal_steps >= 1000 ? (client.goal_steps / 1000).toFixed(0) + 'k' : client.goal_steps)
        : '—';
      const fatDisplay     = client.goal_fat ? '≥' + client.goal_fat + 'g' : '—';

      let workoutPreview = '';
      if (todayWorkout) {
        if (todayWorkout.isRest) {
          workoutPreview = `
            <a href="workout.html" class="workout-preview">
              <div>
                <div class="workout-preview-label">Today's Session</div>
                <div class="workout-preview-name">${escHtml(todayWorkout.label)}</div>
                <div class="workout-preview-rest">Recovery is part of the programme</div>
              </div>
              <svg class="workout-preview-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </a>`;
        } else {
          workoutPreview = `
            <a href="workout.html" class="workout-preview">
              <div>
                <div class="workout-preview-label">Today's Workout</div>
                <div class="workout-preview-name">${escHtml(todayWorkout.label)}</div>
                ${todayWorkout.mainExercise ? `<div class="workout-preview-exercise">${escHtml(todayWorkout.mainExercise.name)}${todayWorkout.mainExercise.scheme ? ' · ' + escHtml(todayWorkout.mainExercise.scheme) : ''}</div>` : ''}
              </div>
              <svg class="workout-preview-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </a>`;
        }
      } else if (programme) {
        workoutPreview = `
          <a href="workout.html" class="workout-preview">
            <div>
              <div class="workout-preview-label">Programme</div>
              <div class="workout-preview-name">${escHtml(programme.name)}</div>
            </div>
            <svg class="workout-preview-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </a>`;
      }

      html += `
        <div class="today-card">
          <div class="today-card-top">
            <div class="today-day-tag">Day ${dayNum}</div>
            ${client.current_phase ? `<div class="today-phase-tag">${escHtml(client.current_phase)}</div>` : ''}
          </div>
          <div class="today-message">${escHtml(message)}</div>
          <div class="goals-pills">
            <div class="goal-pill">
              <div class="goal-pill-value">${calsDisplay}</div>
              <div class="goal-pill-label">Kcals</div>
            </div>
            <div class="goal-pill">
              <div class="goal-pill-value">${proteinDisplay}</div>
              <div class="goal-pill-label">Protein</div>
            </div>
            <div class="goal-pill">
              <div class="goal-pill-value">${stepsDisplay}</div>
              <div class="goal-pill-label">Steps</div>
            </div>
            <div class="goal-pill">
              <div class="goal-pill-value">${fatDisplay}</div>
              <div class="goal-pill-label">Fat Min</div>
            </div>
          </div>
          ${workoutPreview}
        </div>`;

      // ---- Habits this week ----
      const daysThisWeek = Math.max(1, thisWeek.length || 1);
      html += `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Habits This Week</div>
            <div style="font-size:11px;color:var(--subtle)">${thisWeek.length} day${thisWeek.length !== 1 ? 's' : ''} logged</div>
          </div>
          <div class="habits-grid">
            ${habitItem('Cals Logged',  habCalsLogged, daysThisWeek, 'Tracked', true)}
            ${habitItem('Cal Goal Hit', habCalsHit,    daysThisWeek, client.goal_calories ? 'Tracked' : 'No goal set', client.goal_calories != null)}
            ${habitItem('Workout Done', habWorkout,    daysThisWeek, 'Logged', true)}
            ${habitItem('Steps Goal',   habSteps,      daysThisWeek, client.goal_steps ? 'Tracked' : 'No goal set', client.goal_steps != null)}
          </div>
        </div>`;

      // ---- Streak ----
      html += `
        <div class="card">
          <div class="card-title" style="margin-bottom:14px">Check-In Streak</div>
          <div class="streak-row">
            <div class="streak-num">${streak}</div>
            <div>
              <div class="streak-label">${streak === 1 ? 'day' : 'days'} in a row</div>
              <div class="streak-sub">${streak === 0 ? 'Check in today to start your streak' : streak >= 7 ? 'Dialled in 🔥' : 'Keep it going 💪'}</div>
            </div>
          </div>
        </div>`;

      // ---- Weight trend ----
      if (chartData.length >= 2) {
        const trending  = isGoodTrend(chartData, targetWeight);
        const lineColor = trending ? 'var(--green)' : 'var(--subtle)';
        html += `
          <div class="card">
            <div class="card-header">
              <div class="card-title">Weight Trend</div>
              ${targetWeight ? `<div style="font-size:12px;color:var(--muted)">Target: <strong style="color:var(--green)">${targetWeight}kg</strong></div>` : ''}
            </div>
            <div class="chart-wrap">${buildChart(chartData, targetWeight, lineColor)}</div>
          </div>`;
      }

      // ---- Goal progress ----
      if (targetWeight && currentWeight) {
        const firstWeight = checkIns.filter(c => c.weight_kg).slice(-1)[0]?.weight_kg || currentWeight;
        const totalChange = Math.abs(firstWeight - targetWeight);
        const progress    = totalChange > 0
          ? Math.min(100, Math.max(0, (Math.abs(firstWeight - currentWeight) / totalChange) * 100))
          : 100;
        const lost = (firstWeight - currentWeight).toFixed(1);
        const toGo = (currentWeight - targetWeight).toFixed(1);

        html += `
          <div class="card">
            <div class="card-title" style="margin-bottom:14px">Goal Progress</div>
            <div class="goal-row">
              <span class="goal-start">${firstWeight}kg start</span>
              <span class="goal-current">${currentWeight}<span class="unit">kg</span></span>
              <span class="goal-target">${targetWeight}kg target</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${progress.toFixed(1)}%"></div>
            </div>
            <div class="goal-meta">
              ${parseFloat(toGo) <= 0
                ? `🎯 <strong>Target reached!</strong>`
                : parseFloat(lost) > 0
                ? `<strong>${lost}kg down</strong> · ${toGo}kg to go`
                : parseFloat(lost) < 0
                ? `<strong>${Math.abs(lost)}kg up</strong> · ${Math.abs(toGo)}kg to target`
                : `Just getting started — let's go 💪`}
            </div>
          </div>`;
      }

      // ---- Message Coach card ----
      html += `
        <a href="messages.html" style="text-decoration:none;display:block">
          <div class="card" style="display:flex;align-items:center;gap:14px;padding:16px 18px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
            </div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:var(--text)">Message Coach</div>
              <div style="font-size:12px;color:var(--muted);margin-top:1px">Open WhatsApp to chat</div>
            </div>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--subtle)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>`;

      // ---- Progress Photos card ----
      html += `
        <a href="photos.html" style="text-decoration:none;display:block">
          <div class="card" style="display:flex;align-items:center;gap:14px;padding:16px 18px">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(193,88,26,0.12);border:1px solid rgba(193,88,26,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:var(--text)">Progress Photos</div>
              <div style="font-size:12px;color:var(--muted);margin-top:1px">Track your body transformation</div>
            </div>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--subtle)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </a>`;

      document.getElementById('main-content').innerHTML = html;
    }

    // ---- Auto motivational message ----
    function autoMessage(dayNum, streak, name) {
      if (dayNum === 1) return `Day 1 ${name} — let's dial in and smash these goals today 💪`;
      if (streak === 0) return `Day ${dayNum} — get back on it today ${name}, let's lock in 🔒`;
      if (streak >= 14) return `Day ${dayNum} — ${streak} days straight ${name}, you're absolutely dialled in 🔥`;
      if (streak >= 7)  return `Day ${dayNum} — ${streak} day streak, keep that momentum going ${name} 🔥`;
      if (streak >= 3)  return `Day ${dayNum} — ${streak} days in a row ${name}, nice work. Stay locked in today`;
      return `Day ${dayNum} — nice work yesterday ${name}, let's keep pushing today 💪`;
    }

    // ---- Habit item builder ----
    function habitItem(label, count, total, sublabel, active) {
      if (!active || count === null) {
        return `<div class="habit-item">
          <div class="habit-tick miss">–</div>
          <div class="habit-label"><strong>${label}</strong>${sublabel}</div>
        </div>`;
      }
      const pct  = count / total;
      const cls  = pct >= 0.8 ? 'hit' : count > 0 ? 'logged' : 'miss';
      const icon = pct >= 0.8 ? '✓' : count > 0 ? '~' : '–';
      return `<div class="habit-item">
        <div class="habit-tick ${cls}">${icon}</div>
        <div class="habit-label"><strong>${label}</strong>${count}/${total} days</div>
      </div>`;
    }

    // ---- Streak calc ----
    function calcStreak(checkIns) {
      const dates = checkIns.map(c => c.check_in_date).sort().reverse();
      if (!dates.length) return 0;
      let streak = 0;
      let cursor = today;
      if (dates[0] !== today) {
        const yesterday = new Date(Date.now() - 864e5).toISOString().split('T')[0];
        if (dates[0] !== yesterday) return 0;
        cursor = yesterday;
      }
      for (const d of dates) {
        if (d === cursor) {
          streak++;
          cursor = new Date(new Date(cursor + 'T00:00:00').getTime() - 864e5).toISOString().split('T')[0];
        } else { break; }
      }
      return streak;
    }

    function getWeekStart() {
      const d   = new Date();
      const day = d.getDay();
      const mon = new Date(d);
      mon.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      return mon.toISOString().split('T')[0];
    }

    function isGoodTrend(data, target) {
      if (data.length < 2) return true;
      const first = data[0].weight_kg;
      const last  = data[data.length - 1].weight_kg;
      if (!target) return last <= first;
      return target < first ? last < first : last > first;
    }

    function buildChart(data, target, lineColor) {
      if (data.length < 2) return '';
      const W = 320, H = 80, PAD = 8;
      const weights = data.map(d => d.weight_kg);
      let min = Math.min(...weights);
      let max = Math.max(...weights);
      if (target) { min = Math.min(min, target); max = Math.max(max, target); }
      const range = max - min || 1;
      const xStep = (W - PAD * 2) / (data.length - 1);
      const pts   = data.map((d, i) => {
        const x = PAD + i * xStep;
        const y = H - PAD - ((d.weight_kg - min) / range) * (H - PAD * 2);
        return `${x},${y}`;
      });
      let targetLine = '';
      if (target) {
        const ty = H - PAD - ((target - min) / range) * (H - PAD * 2);
        targetLine = `<line x1="${PAD}" y1="${ty}" x2="${W-PAD}" y2="${ty}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>`;
      }
      const lastPt = pts[pts.length - 1].split(',');
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${targetLine}
        <polyline points="${pts.join(' ')}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3" fill="${lineColor}"/>
        <text x="${lastPt[0]}" y="${parseFloat(lastPt[1]) - 6}" font-family="DM Sans,sans-serif" font-size="10" fill="${lineColor}" text-anchor="middle">${data[data.length-1].weight_kg}kg</text>
      </svg>`;
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
