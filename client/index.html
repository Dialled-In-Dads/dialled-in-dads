<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dashboard — Dialed In Dads</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0D1117;
      color: #F0F4F8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder {
      text-align: center;
      padding: 40px 24px;
    }
    .placeholder h1 {
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      letter-spacing: 1.5px;
      color: #2ECC8A;
      margin-bottom: 12px;
    }
    .placeholder p { color: #8892A4; font-size: 15px; margin-bottom: 24px; }
    .client-name { color: #F0F4F8; font-weight: 600; }
    .sign-out-btn {
      background: none;
      border: 1px solid #1E2A3E;
      border-radius: 8px;
      padding: 10px 20px;
      color: #8892A4;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }
    .sign-out-btn:hover { border-color: #C1581A; color: #C1581A; }
  </style>
</head>
<body>
  <div class="placeholder">
    <h1>You're Dialed In 👊</h1>
    <p>Welcome, <span class="client-name" id="client-name">Champ</span>. Dashboard coming next.</p>
    <button class="sign-out-btn" onclick="signOut()">Sign Out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    (async () => {
      const session = await requireClient();
      if (!session) return;
      const client = await getCurrentClient(session.user.id);
      if (client?.name) document.getElementById('client-name').textContent = client.name;
    })();
  </script>
</body>
</html>
